# Issue #189 reproduction sidecar — see README.md and
# docs/proposals/issue-189-connection-lease-proposal.md.
#
# Reuses the repo's standard SQL Server dev container (docker/docker-compose.yml,
# started via `make docker-up`): this file defines ONLY the Python/DuckDB sidecar,
# joined onto that stack's network. No image build — dependencies are installed
# at container start (needs network access on first run).
#
# Usage (from this directory):
#   make -C ../../.. docker-up        # or: make docker-up from the repo root
#   docker compose run --rm repro     # exit code 0 = all failure modes reproduced
#
# The sidecar uses the released community `mssql` extension (what users run).
# To verify a LINUX build of a local extension instead, mount it and set
# MSSQL_EXTENSION_PATH (see commented lines below).

services:
  repro:
    image: python:3.12-slim
    volumes:
      - ./repro.py:/repro.py:ro
      # - ../../../build/release/extension/mssql:/ext:ro   # must be a linux build
    environment:
      - MSSQL_HOST=mssql-dev
      - MSSQL_PORT=1433  # container-side port on the shared network (not MSSQL_TEST_PORT)
      - MSSQL_SA_PASSWORD=${MSSQL_TEST_PASS:-TestPassword1}
      # - MSSQL_EXTENSION_PATH=/ext/mssql.duckdb_extension
    command: >
      bash -ec "apt-get update -qq
      && apt-get install -y -qq --no-install-recommends libgssapi-krb5-2 >/dev/null
      && pip install -q duckdb
      && python /repro.py"

networks:
  # The network `make docker-up` creates (compose project "docker" -> docker_default).
  # Override REPRO_NETWORK if you run the dev container under a custom project name.
  default:
    external: true
    name: ${REPRO_NETWORK:-docker_default}
