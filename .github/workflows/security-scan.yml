name: Security Scan

# Secret scanning + dependency posture. Runs on every PR and on a weekly
# schedule against main so freshly-published advisories surface even when
# there's no PR traffic.
#
# Uses TruffleHog rather than gitleaks because gitleaks-action requires a
# paid license for organization repos as of 2023 (see
# https://github.com/gitleaks/gitleaks-action#-announcement). TruffleHog OSS
# is free for organizations and finds the same class of high-entropy secrets
# plus a verifier layer that culls false positives.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  # Manual runs: a failed scheduled run can only be re-run with the workflow
  # definition from the commit it originally ran against, so a fix to this
  # file never turns an old run green — dispatch a fresh one instead.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so TruffleHog can scan every commit on the PR /
          # branch, not just the tip. Required for detecting secrets that
          # were committed and then "deleted" in a follow-up commit.
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          # On PRs: scan from the base ref to HEAD (only new commits).
          # On push to main / schedule: scan the entire repo history. The
          # action handles the base/head args based on the event.
          #
          # lob detector excluded: its pattern matches C++ test function
          # names like test_serialize_string_unicode_characters (letters and
          # underscores, not an API key shape) and its verifier confirms
          # them, so the full-history scan fails on blobs we can't amend.
          # We don't use Lob (lob.com print/mail API).
          extra_args: --only-verified --exclude-detectors=lob

  # TruffleHog above answers "is a secret committed in the repo?". This answers
  # the different question "can a secret ESCAPE at runtime?" — a credential
  # value reaching a log line, an exception message or a format call.
  #
  # Joern's q6 already expresses this check, but it needs Joern installed and a
  # CPG built, so it lives in `make joern-scan` as an exploratory tool that runs
  # when someone remembers. Credential disclosure is a regression class — issue
  # #492 (mssql_azure_auth_test showed a token's last 3 characters, and a short
  # token in full) is exactly what comes back when a new error message is
  # written next to a credential — so it gets a gate that cannot rot.
  #
  # Pure Python, no dependencies, ~1 second. Runs on the same events as the
  # secret scan above.
  credential-logging:
    name: Credential-in-log gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The detector's own fixtures. A silently-broken gate is worse than no
      # gate: the first cut of this script counted braces as nesting depth, so
      # every file collapsed into one statement and every finding reported at
      # line 1 — while still exiting plausibly. These fixtures catch that.
      - name: Self-test the detector
        run: scripts/ci/check_credential_logging.py --self-test

      - name: Scan src/ for credentials reaching a message sink
        run: scripts/ci/check_credential_logging.py --root src
