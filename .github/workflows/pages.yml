name: Deploy docs + metrics page

# Publishes to GitHub Pages (https://hugr-lab.github.io/mssql-extension/):
#   /                       Docusaurus documentation site (website/)
#   /metrics/               the DuckDB-Wasm interactive download-metrics chart (web/)
#   /download-metrics.svg   static chart the README embeds — PATH IS STABLE, the
#                           README hotlinks it; move it and the README image dies
#
# The DOCS are built from the LATEST RELEASE TAG, not from main: the site is
# the documentation of what users can install, and main runs ahead of it
# between releases (maintainer decision, 2026-08-05). Bootstrap fallback: while
# the latest tag predates website/'s existence, build from main instead.
# The SVG is rendered fresh on every run (weekly schedule) — that part keeps
# the pre-docs behavior: no commit, no PR, `contents: read` only.

on:
  release:
    types: [published]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC (the weekly archive refreshes daily ~04:00Z)
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/update_download_metrics.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags needed to resolve the docs ref

      - name: Resolve the docs source ref
        id: docsref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            REF="${{ github.event.release.tag_name }}"
          else
            REF=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
          fi
          # Bootstrap: a tag from before the docs site existed has no website/.
          if [ -z "$REF" ] || ! git ls-tree -r --name-only "$REF" | grep -q '^website/package.json$'; then
            echo "docs ref '$REF' has no website/ — building docs from main"
            REF="${{ github.sha }}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building docs from: $REF"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install DuckDB CLI
        # Pinned version + checksum (not "latest"): this CLI fetches and
        # aggregates the metrics, so it must be exactly the reviewed bytes.
        # Update both values together when bumping.
        env:
          DUCKDB_VERSION: v1.5.3
          DUCKDB_SHA256: 35caef1fecbc8d7e2c07de4fd2cdefc5189ec9ba9e1cca228fb1a1c48cc52a8a
        run: |
          curl -fsSL -o /tmp/duckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          echo "${DUCKDB_SHA256}  /tmp/duckdb.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          unzip -o /tmp/duckdb.zip -d "$HOME/.local/bin"
          "$HOME/.local/bin/duckdb" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the docs site from the resolved ref
        run: |
          git worktree add /tmp/docs-src "${{ steps.docsref.outputs.ref }}"
          cd /tmp/docs-src/website
          npm ci
          npx docusaurus build
          mkdir -p "$GITHUB_WORKSPACE/_site"
          cp -r build/. "$GITHUB_WORKSPACE/_site/"

      - name: Add the metrics chart and the fresh SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p _site/metrics
          cp -r web/. _site/metrics/
          # --svg-only renders the chart and touches nothing else. The README
          # points at this URL, so the image carries the freshness.
          python3 scripts/update_download_metrics.py --svg-only _site/download-metrics.svg
          ls -l _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
