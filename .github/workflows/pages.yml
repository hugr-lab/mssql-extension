name: Deploy docs + metrics page

# Publishes to GitHub Pages (https://hugr-lab.github.io/mssql-extension/):
#   /                       Docusaurus documentation site (website/)
#   /metrics/               the DuckDB-Wasm interactive download-metrics chart (web/)
#   /download-metrics.svg   static chart the README embeds — PATH IS STABLE, the
#                           README hotlinks it; move it and the README image dies
#
# The docs build from MAIN, and Docusaurus VERSIONING keeps released content
# authoritative: at each release `docs:version <X.Y.Z>` snapshots the docs
# into versioned_docs/, which serves at the ROOT as the default; the live
# docs/ tree publishes as "Next" under /next/ with an unreleased banner. So a
# main push only ever changes /next/ until the next release snapshot — docs
# for the coming release stay reachable but never become the default
# (maintainer decision, 2026-08-06; supersedes the build-from-tag scheme).
# The SVG is rendered fresh on every run (weekly schedule) — that part keeps
# the pre-docs behavior: no commit, no PR, `contents: read` only.
#
# The same docs are built a second time for hugr-lab.com (DOCS_TARGET=ionos,
# see website/docusaurus.config.ts) and mirrored there over SFTP by the
# `ionos` job, which runs only while the organisation variable DOCS_IONOS is
# 'true' (credentials: the organisation secrets IONOS_SFTP_*). It is a job of
# its own, after `deploy`, for two reasons: a failed IONOS build or upload must
# not mark the Pages deploy failed, and the `pages` group's
# cancel-in-progress must not stop `mirror --delete` halfway and leave a
# half-updated copy -- its own group queues instead. That copy has no /metrics/
# page (it loads DuckDB-Wasm from a CDN, which hugr-lab.com's CSP forbids); its
# chart is the build's own download-metrics.svg, this run's render, handed over
# as an artifact.

on:
  release:
    types: [published]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC (the weekly archive refreshes daily ~04:00Z)
  push:
    branches: [main]
    paths:
      - "web/**"
      - "website/**"
      - "scripts/update_download_metrics.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install DuckDB CLI
        # Pinned version + checksum (not "latest"): this CLI fetches and
        # aggregates the metrics, so it must be exactly the reviewed bytes.
        # Update both values together when bumping.
        env:
          DUCKDB_VERSION: v1.5.3
          DUCKDB_SHA256: 35caef1fecbc8d7e2c07de4fd2cdefc5189ec9ba9e1cca228fb1a1c48cc52a8a
        run: |
          curl -fsSL -o /tmp/duckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          echo "${DUCKDB_SHA256}  /tmp/duckdb.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          unzip -o /tmp/duckdb.zip -d "$HOME/.local/bin"
          "$HOME/.local/bin/duckdb" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render the fresh SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # --svg-only renders the chart and touches nothing else. Rendered
          # into website/static/ BEFORE the builds, so both copies of the docs
          # carry it: at the build's root (the stable path the README hotlinks,
          # https://hugr-lab.github.io/mssql-extension/download-metrics.svg)
          # and on the Overview page. The committed file is only the fallback
          # local and PR builds use; nothing commits the fresh one back.
          python3 scripts/update_download_metrics.py --svg-only website/static/download-metrics.svg

      - name: Hand the SVG to the hugr-lab.com job
        if: ${{ vars.DOCS_IONOS == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: download-metrics-svg
          path: website/static/download-metrics.svg
          retention-days: 1

      - name: Build the docs site
        run: |
          cd website
          npm ci
          npx docusaurus build
          mkdir -p "$GITHUB_WORKSPACE/_site"
          cp -r build/. "$GITHUB_WORKSPACE/_site/"

      - name: Add the metrics chart
        run: |
          mkdir -p _site/metrics
          cp -r web/. _site/metrics/
          ls -l _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

  ionos:
    needs: deploy
    if: ${{ vars.DOCS_IONOS == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: docs-ionos
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: download-metrics-svg
          path: website/static

      - name: Build for hugr-lab.com
        working-directory: website
        env:
          DOCS_TARGET: ionos
        run: |
          npm ci
          npm run build -- --out-dir build-ionos

      - name: Nothing loaded from another host
        run: python3 scripts/ci/check_docs_no_third_party.py website/build-ionos

      - name: Upload to hugr-lab.com (IONOS)
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          # IONOS_DOCS_ROOT: an organisation variable, for an SFTP user whose
          # access is the docs folder alone.
          REMOTE: ${{ vars.IONOS_DOCS_ROOT || '/hugr-lab/docs' }}/mssql-extension
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Mirrors the build into <docs root>/mssql-extension on IONOS; nothing outside that folder is touched.
          lftp --env-password -u "$USER" -e "set sftp:auto-confirm yes; set net:max-retries 3; \
            mirror --reverse --delete --verbose website/build-ionos/ \"$REMOTE\"; bye" \
            "sftp://$HOST"
