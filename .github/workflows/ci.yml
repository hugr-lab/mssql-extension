name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Docs-only PRs skip CI (lint + C++ unit tests). Prose-scanning workflows
    # (prompt-injection, secret scan) have their own triggers and still run.
    # NOTE: if Lint / "C++ Unit Tests" are required status checks, GitHub treats
    # a path-skipped required check as pending and can block docs PRs — either
    # mark them non-required or add a passing stub. See PR description.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  schedule:
    # Weekly regression build (Mondays 05:00 UTC). The heavy build job is
    # manual-dispatch only, so without this the C++ unit tests it carries
    # (incl. test_login_error_state, issue #164) and the integration suite get
    # no automatic coverage between releases. Runs build + smoke + integration;
    # Windows / Azure stay manual (cost, and #165 keeps MSVC red).
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      run_build:
        description: 'Run build and tests'
        required: false
        default: false
        type: boolean
      run_integration_tests:
        description: 'Run SQL Server integration tests (requires run_build)'
        required: false
        default: true
        type: boolean
      run_windows_build:
        description: 'Run Windows builds (MSVC and MinGW)'
        required: false
        default: false
        type: boolean
      run_azure_tests:
        description: 'Run Azure SQL/Fabric tests (requires run_build, use on feature branches only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # SQL Server test environment
  MSSQL_TEST_HOST: localhost
  MSSQL_TEST_PORT: 1433
  MSSQL_TEST_USER: sa
  MSSQL_TEST_PASS: TestPassword1
  MSSQL_TEST_DB: master

jobs:
  # ============================================================================
  # Lint Job - Check code formatting (runs on merge to main)
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14
          find src -name '*.cpp' -o -name '*.hpp' | xargs clang-format-14 --dry-run --Werror

      # Spec 063 D7. A sqllogictest file whose require-env variable is unset does
      # not fail — it SKIPS, and the run reports success. Spec 057 found that
      # class three times in one spec (MSSQL_TEST_SERVER hid 4 files,
      # MSSQL_TEST_CONNECTION_STRING 4 more including both auto-TABLOCK tests,
      # and a filter matching nothing hid 164). This is what makes the fourth a
      # build failure instead of a green run. No build needed — it reads files.
      - name: Every require-env variable is actually set
        run: scripts/ci/check_require_env.sh

  # ============================================================================
  # C++ Unit Tests Job - lightweight, no SQL Server / DuckDB build required.
  # Runs on every push/PR (unlike the heavy build job, which is manual).
  # Spec 053 (#161): guards the lazy GSSAPI/krb5 linking so the regression
  # cannot return — the shim must compile and add NO hard DT_NEEDED on the
  # Kerberos runtime.
  # ============================================================================
  cpp-unit-tests:
    name: C++ Unit Tests (${{ matrix.os.id }})
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - id: linux
            runner: ubuntu-latest
          - id: macos
            runner: macos-14
    steps:
      - uses: actions/checkout@v7

      # libssl-dev is for the spec 068 routing test below, which links
      # -lssl -lcrypto (tds_socket.hpp pulls in the TLS context). It rides along
      # with this step because this one already runs apt-get update, and
      # depending on the runner image happening to carry OpenSSL headers is the
      # kind of assumption that breaks quietly on an image bump.
      - name: Install Kerberos + OpenSSL dev headers (Linux)
        if: matrix.os.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev binutils pkg-config libssl-dev

      - name: Build + run gssapi_runtime loader unit test (spec 053)
        run: |
          if [ "${{ matrix.os.id }}" = "macos" ]; then
            clang++ -std=c++17 -pthread -DMSSQL_ENABLE_KRB5=1 -I src/include \
              test/cpp/test_gssapi_runtime.cpp src/tds/auth/gssapi_runtime.cpp \
              -framework GSS -o /tmp/test_gssapi_runtime
          else
            g++ -std=c++17 -pthread -DMSSQL_ENABLE_KRB5=1 -I src/include \
              $(pkg-config --cflags krb5-gssapi krb5) \
              test/cpp/test_gssapi_runtime.cpp src/tds/auth/gssapi_runtime.cpp \
              -ldl -o /tmp/test_gssapi_runtime
          fi
          /tmp/test_gssapi_runtime

      - name: Assert shim has no Kerberos DT_NEEDED (Linux)
        if: matrix.os.id == 'linux'
        run: |
          echo "Dynamic deps of the shim test binary (must NOT list gssapi/krb5):"
          readelf -d /tmp/test_gssapi_runtime | grep NEEDED || true
          if readelf -d /tmp/test_gssapi_runtime | grep NEEDED | grep -iqE 'gssapi|krb5'; then
            echo "::error::shim links the Kerberos runtime at load time — issue #161 regression (spec 053)."
            exit 1
          fi
          echo "OK: shim resolves GSSAPI/krb5 lazily via dlopen; no hard dependency."

      # Spec 049 (#85): the catalog records the target's physical shape, but
      # nothing consumes it until the write path lands. This is what would
      # notice the sys.indexes.type mapping being renumbered or inverted —
      # in particular type 5 (clustered COLUMNSTORE), which reports index_id 1
      # exactly like a rowstore index but wants the opposite TABLOCK answer.
      # Self-contained header: no submodule checkout, nothing to link.
      - name: Build + run MSSQLIndexKind unit test (spec 049)
        run: |
          c++ -std=c++17 -pthread -I src/include \
            test/cpp/test_index_kind.cpp -o /tmp/test_index_kind
          /tmp/test_index_kind

      # Spec 068: login-time routing (ENVCHANGE 20) is followed on every auth
      # path. Drives a real TdsConnection against a loopback fake TDS server on
      # 127.0.0.1 -- no SQL Server, no Azure, no AD. It lives in THIS job rather
      # than the build job's "Run C++ unit tests" step on purpose: that job is
      # dispatch/schedule-gated, and a routing regression must fail the PR that
      # causes it. tds_connection.cpp reaches nothing outside the TDS layer, so
      # the only externals are simdutf (via encoding/utf16.cpp) and OpenSSL
      # (via tds_socket.hpp -> the TLS TUs; the test itself runs unencrypted).
      # simdutf comes from the upstream single-file amalgamation rather than a
      # distro package: Ubuntu 24.04 (noble) has no libsimdutf-dev (the repo's
      # own test/kerberos/test-client/Dockerfile says so and builds from source
      # for the same reason), and brew/apt would ship 8.x while the extension
      # links what vcpkg.json pins. The version is READ FROM vcpkg.json rather
      # than hardcoded, so bumping the override cannot silently leave this test
      # on the old codec; the checksum is pinned alongside it, so such a bump
      # fails here loudly and visibly instead of pulling unreviewed bytes.
      - name: Fetch simdutf amalgamation (spec 068 routing test)
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci/simdutf_pin.env
          . scripts/ci/simdutf_pin.env
          # `next(..., '')` rather than `[0]`: vcpkg.json's own comments
          # contemplate dropping the override once the baseline catches up, and
          # an IndexError traceback is not the guidance a maintainer needs.
          SIMDUTF_VER=$(python3 -c "import json;print(next((o['version'] for o in json.load(open('vcpkg.json'))['overrides'] if o['name']=='simdutf'), ''))")
          if [ -z "$SIMDUTF_VER" ]; then
            echo "::error::vcpkg.json no longer overrides simdutf, so the routing test cannot tell which version the extension links. Either restore the override or pin the version directly in scripts/ci/simdutf_pin.env and drop this check."
            exit 1
          fi
          if [ "$SIMDUTF_VER" != "$SIMDUTF_EXPECTED_VER" ]; then
            echo "::error::vcpkg.json now pins simdutf $SIMDUTF_VER but scripts/ci/simdutf_pin.env records $SIMDUTF_EXPECTED_VER. Download the new asset, record its SHA-256, and update that file."
            exit 1
          fi
          echo "vcpkg.json pins simdutf $SIMDUTF_VER"
          mkdir -p /tmp/simdutf
          curl -sSL --fail --retry 3 -o /tmp/simdutf/singleheader.zip \
            "https://github.com/simdutf/simdutf/releases/download/v${SIMDUTF_VER}/singleheader.zip"
          echo "$SIMDUTF_EXPECTED_SHA  /tmp/simdutf/singleheader.zip" | shasum -a 256 -c -
          unzip -o -q /tmp/simdutf/singleheader.zip -d /tmp/simdutf
          test -f /tmp/simdutf/simdutf.cpp && test -f /tmp/simdutf/simdutf.h

      - name: Build + run login routing hop-driver test (spec 068)
        run: |
          set -euo pipefail
          if [ "${{ matrix.os.id }}" = "macos" ]; then
            OPENSSL_PREFIX="$(brew --prefix openssl@3)"
            EXTRA_INC="-I $OPENSSL_PREFIX/include"
            EXTRA_LIB="-L $OPENSSL_PREFIX/lib"
          else
            EXTRA_INC=""
            EXTRA_LIB=""
          fi
          c++ -std=c++17 -pthread -Wno-deprecated-declarations \
            -I src/include -I /tmp/simdutf $EXTRA_INC \
            test/cpp/test_login_routing_hops.cpp \
            src/tds/tds_connection.cpp src/tds/tds_socket.cpp \
            src/tds/tls/tds_tls_context.cpp src/tds/tls/tds_tls_impl.cpp \
            src/tds/tds_packet.cpp src/tds/tds_protocol.cpp src/tds/tds_types.cpp \
            src/tds/encoding/utf16.cpp /tmp/simdutf/simdutf.cpp \
            $EXTRA_LIB -lssl -lcrypto \
            -o /tmp/test_login_routing_hops
          /tmp/test_login_routing_hops

      # Spec 063 D1: who supplies a bulk-load writer's connection and how many
      # writers there may be. Every case it decides fails SILENTLY when wrong —
      # a writer given the pinned connection interleaves ROW tokens into someone
      # else's bulk load; a second writer inside a transaction lands rows that do
      # not roll back; a second writer against a `#temp` target writes to whatever
      # same-named table that pooled session holds. An end-to-end test sees a load
      # that succeeded, so the policy is asserted directly.
      # Self-contained header: no submodule checkout, nothing to link.
      - name: Build + run load-policy unit test (spec 063)
        run: |
          c++ -std=c++17 -pthread -I src/include \
            test/cpp/test_load_policy.cpp -o /tmp/test_load_policy
          /tmp/test_load_policy

  # ============================================================================
  # Windows SSPI Unit Test - ungated, like cpp-unit-tests above.
  #
  # Issue #260: WinSspiAuthenticator had no automated coverage. Its only test
  # assumes a domain-joined host and sits on the never-set allowlist in
  # check_require_env.sh, and the Windows BUILD jobs are dispatch-gated -- so
  # putting it there would trade a test nobody runs for a test that runs when
  # somebody ticks a box.
  #
  # It belongs in its own job rather than as a windows entry in the
  # cpp-unit-tests matrix because five of that job's steps are POSIX-only
  # (pkg-config, readelf, shasum, `c++`) and would each need an `if:` guard.
  #
  # No vcpkg needed: winsspi_authenticator.cpp includes only its own header and
  # the Windows SDK. Acquiring a Negotiate credential and producing the first
  # token uses the local logon session -- no domain, no SQL Server, no network.
  # ============================================================================
  windows-sspi-test:
    name: Windows SSPI Unit Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Visual Studio Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build + run Windows SSPI context test (issue #260)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cl /std:c++17 /EHsc /nologo /MT /DMSSQL_ENABLE_SSPI=1 `
            /I src/include `
            test/cpp/test_winsspi_context.cpp `
            src/tds/auth/winsspi_authenticator.cpp `
            /Fe:test_winsspi_context.exe `
            /link secur32.lib
          if ($LASTEXITCODE -ne 0) { throw "compile failed" }
          ./test_winsspi_context.exe
          if ($LASTEXITCODE -ne 0) { throw "test failed" }

  # ============================================================================
  # Build Job - Build against DuckDB stable on representative platforms
  # (Manual trigger only via workflow_dispatch)
  # ============================================================================

  # Owns the build platform list, so it exists exactly ONCE (job 1182). It was
  # briefly written out twice inside one expression — a PR array and a full array
  # — which meant an edit to one (a runner bump, a triplet change, a new field)
  # would silently make pull requests build a DIFFERENT configuration than merges
  # to main: green PR, broken main, which is the very class #279 exists to close.
  #
  # A job output rather than a condition on `build`'s own `if`, because GitHub
  # does not expose the `matrix` context to `jobs.<id>.if` — a
  # `matrix.platform.id == '...'` test there evaluates empty and the job silently
  # never runs.
  build-matrix:
    name: Resolve build matrix
    runs-on: ubuntu-22.04
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.run_build)
          || github.event_name == 'schedule'
          || github.event_name == 'push'
          || github.event_name == 'pull_request' }}
    outputs:
      platforms: ${{ steps.pick.outputs.platforms }}
    steps:
      - id: pick
        env:
          # The single source of truth for both entries.
          ALL: >-
            [{"id":"linux_amd64","os":"linux","arch":"amd64","runner":"ubuntu-22.04","docker_available":true,"vcpkg_triplet":"x64-linux"},
             {"id":"osx_arm64","os":"osx","arch":"arm64","runner":"macos-14","docker_available":false,"vcpkg_triplet":"arm64-osx"}]
          EVENT: ${{ github.event_name }}
        run: |
          # A pull request builds Linux only: it is the platform the integration
          # lane consumes, and one compile per PR is the price of the check.
          # macOS stays on merge / schedule / dispatch, where a platform-specific
          # break is still caught before a release rather than at it.
          if [ "$EVENT" = "pull_request" ]; then
            picked=$(printf '%s' "$ALL" | jq -c '[.[] | select(.id == "linux_amd64")]')
          else
            picked=$(printf '%s' "$ALL" | jq -c '.')
          fi
          echo "platforms=$picked" >> "$GITHUB_OUTPUT"
          echo "Building: $(printf '%s' "$picked" | jq -r '[.[].id] | join(", ")')"

  build:
    name: Build (${{ matrix.platform.id }})
    runs-on: ${{ matrix.platform.runner }}
    # On a merge to `main` (issue #212 gap 1) AND on the pull request itself
    # (issue #279). Building only on the merge turned a green PR into "nobody has
    # compiled this yet" — the regression is still found, just after it has
    # landed. #269, #270 and #274 all changed src/table_scan/ or src/copy/ and
    # none was compiled by CI before merge.
    #
    # On a pull request this is LINUX ONLY, deliberately: it is the platform the
    # integration lane needs anyway, and one compile per PR is the price of the
    # check. macOS stays on merge/schedule/dispatch, where a platform-specific
    # break is still caught before a release rather than at it. WINDOWS is
    # dispatch-ONLY (`inputs.run_windows_build`) — it runs on neither merge nor
    # schedule, so an MSVC/MinGW break is caught only when someone asks.
    # Docs-only PRs are already free via the workflow's `paths-ignore`.
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.run_build)
          || github.event_name == 'schedule'
          || github.event_name == 'push'
          || github.event_name == 'pull_request' }}
    needs: build-matrix
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.build-matrix.outputs.platforms) }}

    env:
      # Send vcpkg's binary cache to a directory actions/cache persists (see
      # the "Cache vcpkg binary packages" step). Without this, vcpkg falls back
      # to its default files provider under $HOME/.cache/vcpkg/archives, which
      # nothing caches -- so every run rebuilt OpenSSL from source.
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite'

    steps:
      - uses: actions/checkout@v7

      - name: Checkout DuckDB submodule
        run: |
          git submodule update --init --recursive duckdb

      - name: Log build metadata
        id: duckdb
        run: |
          DUCKDB_COMMIT=$(git -C duckdb rev-parse HEAD)
          DUCKDB_BRANCH=$(git -C duckdb branch --show-current 2>/dev/null || git config -f .gitmodules submodule.duckdb.branch 2>/dev/null || echo "unknown")
          echo "commit=$DUCKDB_COMMIT" >> $GITHUB_OUTPUT
          echo "============================================"
          echo "Build Metadata"
          echo "============================================"
          echo "DuckDB Branch: $DUCKDB_BRANCH"
          echo "DuckDB Commit: $DUCKDB_COMMIT"
          echo "Platform: ${{ matrix.platform.id }}"
          echo "Runner: ${{ matrix.platform.runner }}"
          echo "============================================"

      - name: Setup Ninja
        run: |
          if [ "${{ matrix.platform.os }}" = "osx" ]; then
            brew install ninja ccache
          else
            sudo apt-get update
            # libkrb5-dev enables the integrated-auth (Kerberos) build path so
            # the shipped artifact contains the spec 053 dlopen shim; the
            # readelf guard below then verifies it carries no hard DT_NEEDED.
            sudo apt-get install -y ninja-build ccache libkrb5-dev
          fi

      # Cache ccache to speed up compilation
      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.platform.id }}-${{ steps.duckdb.outputs.commit }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.platform.id }}-${{ steps.duckdb.outputs.commit }}-
            ccache-${{ matrix.platform.id }}-

      - name: Configure ccache
        run: |
          # 2G (was 500M): a full DuckDB object set overflows 500M and evicts
          # itself mid-build, so warm runs were partially cold. 2G holds the
          # DuckDB + extension objects across runs for a much higher hit rate.
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache -z

      - name: Setup vcpkg
        run: |
          # Pinned to vcpkg.json's builtin-baseline: an unpinned master clone
          # rides vcpkg's scripts ahead of the pinned ports, and the first
          # cold-cache port build breaks when those scripts outgrow the
          # runner's CMake (v0.2.3 release: z_vcpkg_spdx.cmake started using
          # string(JSON ... STRING_ENCODE), CMake >= 4.1, and arm64-linux —
          # the one platform without a warm openssl archive — failed).
          if [ ! -d "vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git
            BASELINE=$(grep -o '"builtin-baseline": *"[a-f0-9]*"' vcpkg.json | grep -oE '[a-f0-9]{40}')
            git -C vcpkg checkout "$BASELINE"
            ./vcpkg/bootstrap-vcpkg.sh
          fi

      # Cache vcpkg's BINARY cache (the archives dir), not the install tree.
      #
      # The previous version cached vcpkg/installed + vcpkg/packages +
      # vcpkg/buildtrees, which never worked: in manifest mode vcpkg installs
      # into build/release/vcpkg_installed and looks for prebuilt archives in
      # its binary cache, so none of those three paths were ever consulted.
      # Runs 29339658347 and 29345077972 both logged
      #   "Cache restored from key: vcpkg-x64-linux-..."   (a HIT)
      #   "Building openssl:x64-linux@3.4.1..."            (rebuilt anyway)
      # i.e. ~2 min of OpenSSL rebuild per run despite a green cache hit.
      #
      # Pointing VCPKG_BINARY_SOURCES at a `files` dir and caching THAT dir is
      # what actually elides the rebuild. Archives are keyed by vcpkg's ABI
      # hash, so a stale restore can't produce a wrong binary -- vcpkg simply
      # misses and rebuilds. That makes the prefix restore-key safe.
      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: vcpkg_bincache
          # The primary key MUST be unique per run. actions/cache skips the
          # post-run save on an exact primary-key hit (saveImpl.ts: "Cache hit
          # occurred on the primary key ..., not saving cache."). With a stable
          # key the cache would freeze after the first save: once the ABI hash
          # drifts -- a runner-image compiler bump, or vcpkg master churn, since
          # the clone above is unpinned -- vcpkg would rebuild every run and the
          # fresh archives would never be persisted. That is the same silent
          # no-op this whole change exists to kill.
          #
          # hashFiles('vcpkg.json') is kept only as a readable namespace marker;
          # it is NOT sufficient on its own, because vcpkg.json's `version` is
          # the extension's own version (rotates for the wrong reason) and it
          # says nothing about compiler/triplet/vcpkg-tool (fails to rotate for
          # the right one). The prefix restore-key below is what actually seeds
          # each run, and it matches across hashes.
          key: vcpkg-bincache-${{ matrix.platform.vcpkg_triplet }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bincache-${{ matrix.platform.vcpkg_triplet }}-

      - name: Build Release
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          mkdir -p build/release
          cd build/release
          cmake -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_TOOLCHAIN_FILE="$(pwd)/../../vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_DIR="$(pwd)/../.." \
            -DDUCKDB_EXTENSION_CONFIGS="$(pwd)/../../extension_config.cmake" \
            ../../duckdb
          cmake --build . --config Release

      # actions/cache restores the previous generation's archives and vcpkg
      # only ever adds to them, so without pruning this dir grows monotonically:
      # ABI-named archives from superseded compilers / vcpkg baselines are never
      # evicted, and each run's save carries the whole pile forward. Left alone
      # it eats GitHub's 10 GB per-repo cache budget, at which point LRU starts
      # silently dropping *other* caches (ccache, DuckDB). Runs before the
      # post-job save; always() so a failed build still saves a pruned dir.
      - name: Prune stale vcpkg binary archives
        if: always()
        shell: bash
        run: |
          [ -d vcpkg_bincache ] || exit 0
          echo "before: $(du -sh vcpkg_bincache | cut -f1)"
          find vcpkg_bincache -type f -mtime +14 -delete
          find vcpkg_bincache -mindepth 1 -type d -empty -delete
          echo "after:  $(du -sh vcpkg_bincache | cut -f1)"

      - name: Show ccache stats
        run: ccache -s

      # Standalone C++ unit tests (test/cpp/*) — pure in-memory, no SQL Server.
      # Reuses the simdutf already built by vcpkg for the release tree.
      - name: Run C++ unit tests
        run: |
          set -euo pipefail
          PREFIX="build/release/vcpkg_installed/${{ matrix.platform.vcpkg_triplet }}"
          if [ ! -f "$PREFIX/include/simdutf.h" ]; then
            echo "simdutf not found under $PREFIX" >&2
            ls -R build/release/vcpkg_installed 2>/dev/null | head -50 >&2 || true
            exit 1
          fi
          mkdir -p build/test
          echo "::group::test_login7_encoding (spec 043 + issue #138 LOGIN7 fragmentation)"
          "${CXX:-c++}" -std=c++17 -pthread -Wno-deprecated-declarations -DMSSQL_BENCH_BUILD \
            -I src/include -I duckdb/src/include -I duckdb/third_party/fmt/include -I "$PREFIX/include" \
            test/cpp/test_login7_encoding.cpp \
            src/tds/tds_packet.cpp src/tds/tds_protocol.cpp src/tds/tds_types.cpp src/tds/encoding/utf16.cpp \
            -L "$PREFIX/lib" -lsimdutf \
            -o build/test/test_login7_encoding
          ./build/test/test_login7_encoding
          echo "::endgroup::"

          echo "::group::test_login_error_state (issue #164 — capture LOGIN7 18456 State byte)"
          # TDS-only, like test_login7_encoding above: no libduckdb, just the
          # protocol parser. Pins LoginResponse::error_state so 18456 failures
          # surface the State that distinguishes bad password from inaccessible db.
          "${CXX:-c++}" -std=c++17 -pthread -Wno-deprecated-declarations \
            -I src/include -I duckdb/src/include -I duckdb/third_party/fmt/include -I "$PREFIX/include" \
            test/cpp/test_login_error_state.cpp \
            src/tds/tds_packet.cpp src/tds/tds_protocol.cpp src/tds/tds_types.cpp src/tds/encoding/utf16.cpp \
            -L "$PREFIX/lib" -lsimdutf \
            -o build/test/test_login_error_state
          ./build/test/test_login_error_state
          echo "::endgroup::"

          echo "::group::test_skip_form_equivalence (spec 058 D1-alt — fast skip walk vs the legacy arms)"
          # TDS-only, like the two above. Pins ResolveSkipForm/SkipByForm against
          # SkipValue/SkipValueNBC for every type: the two switches live in one
          # file with nothing else holding them together, and a width edited in
          # one and not the other misframes every row after that column with no
          # other test failing.
          "${CXX:-c++}" -std=c++17 -pthread -Wno-deprecated-declarations \
            -I src/include -I duckdb/src/include -I duckdb/third_party/fmt/include -I "$PREFIX/include" \
            test/cpp/test_skip_form_equivalence.cpp \
            src/tds/tds_row_reader.cpp src/tds/tds_column_metadata.cpp \
            src/tds/tds_types.cpp src/tds/tds_token_parser.cpp src/tds/encoding/utf16.cpp \
            -L "$PREFIX/lib" -lsimdutf \
            -o build/test/test_skip_form_equivalence
          ./build/test/test_skip_form_equivalence
          echo "::endgroup::"

          echo "::group::test_datetime_codec (codec::datetime — issue #168 datetime2(7) overflow -> NULL)"
          # Unlike the TDS-only test above, the codec test uses DuckDB
          # Value/Vector/Date/Timestamp, so it links the libduckdb just built in
          # this job (build/release/src). Mirrors the Makefile `test-codec-datetime`
          # recipe: all src/codec/*.cpp + the encoding helpers, -lsimdutf -lduckdb.
          "${CXX:-c++}" -std=c++17 -pthread -Wno-deprecated-declarations \
            -I src/include -I duckdb/src/include -I duckdb/third_party/fmt/include -I "$PREFIX/include" \
            test/cpp/codec/test_datetime_codec.cpp \
            src/codec/*.cpp \
            src/tds/encoding/utf16.cpp src/tds/encoding/datetime_encoding.cpp \
            src/tds/encoding/decimal_encoding.cpp src/tds/encoding/guid_encoding.cpp \
            -L "$PREFIX/lib" -lsimdutf \
            -L build/release/src -lduckdb \
            -o build/test/test_datetime_codec
          LD_LIBRARY_PATH=build/release/src DYLD_LIBRARY_PATH=build/release/src ./build/test/test_datetime_codec
          echo "::endgroup::"

          # Three unit tests that were in the tree but built by NOTHING — not
          # CMake, not the Makefile, not this workflow. Nobody compiled them,
          # so nobody noticed the code moving underneath: HUGEINT and INTERVAL
          # were still asserted "unsupported" after spec 045 gave them
          # DECIMAL(38,0) and NVARCHAR(50), TIMESTAMP was still DATETIME2(7),
          # an identifier-quoting case had one bracket too many, and the LIKE
          # conversion tests predated underscore escaping. All four were wrong
          # about the CODE, not the other way round.
          for t in test_ddl_translator test_ctas_type_mapping test_catalog_filter; do
            case "$t" in
              test_catalog_filter) EXTRA="src/catalog/mssql_catalog_filter.cpp" ;;
              *)                   EXTRA="src/catalog/mssql_ddl_translator.cpp" ;;
            esac
            echo "::group::${t}"
            "${CXX:-c++}" -std=c++17 -pthread -Wno-deprecated-declarations \
              -I src/include -I duckdb/src/include -I duckdb/third_party/fmt/include -I "$PREFIX/include" \
              "test/cpp/${t}.cpp" src/codec/*.cpp $EXTRA \
              src/tds/encoding/utf16.cpp src/tds/encoding/decimal_encoding.cpp \
              src/tds/encoding/guid_encoding.cpp src/tds/encoding/datetime_encoding.cpp \
              src/tds/encoding/bcp_row_encoder.cpp \
              -L "$PREFIX/lib" -lsimdutf \
              -L build/release/src -lduckdb \
              -o "build/test/${t}"
            LD_LIBRARY_PATH=build/release/src DYLD_LIBRARY_PATH=build/release/src "./build/test/${t}"
            echo "::endgroup::"
          done

          # spec 054: run the remaining per-family codec unit tests. Only
          # datetime ran in CI before, so the #177 HUGEINT guard and the W1
          # dictionary/constant fixes had no CI coverage. Same link set as
          # `make test-codec-<fam>`, plus bcp_row_encoder.cpp — integer/decimal
          # EncodeToBcp call BCPRowEncoder::EncodeDecimal, defined there.
          for fam in boolean integer float decimal string binary uuid money; do
            echo "::group::test_${fam}_codec"
            "${CXX:-c++}" -std=c++17 -pthread -Wno-deprecated-declarations \
              -I src/include -I duckdb/src/include -I duckdb/third_party/fmt/include -I "$PREFIX/include" \
              "test/cpp/codec/test_${fam}_codec.cpp" \
              src/codec/*.cpp \
              src/tds/encoding/utf16.cpp src/tds/encoding/datetime_encoding.cpp \
              src/tds/encoding/decimal_encoding.cpp src/tds/encoding/guid_encoding.cpp \
              src/tds/encoding/bcp_row_encoder.cpp \
              -L "$PREFIX/lib" -lsimdutf \
              -L build/release/src -lduckdb \
              -o "build/test/test_${fam}_codec"
            LD_LIBRARY_PATH=build/release/src DYLD_LIBRARY_PATH=build/release/src "./build/test/test_${fam}_codec"
            echo "::endgroup::"
          done

          # PR #245: dictionary/constant vectors through the BCP encoder,
          # constructed explicitly. The SQL twin (vector_encodings_bcp.test)
          # relies on the parquet reader / storage layer CHOOSING dictionary
          # encoding and would keep passing if they stopped; this one cannot go
          # vacuous. Needs Vector/DataChunk plus the encoder's full dependency
          # cone (BCPColumnMetadata methods live in target_resolver.cpp, which
          # pulls catalog/connection/TLS), so it links the just-built static
          # archives exactly like `make test-cpp` does.
          echo "::group::test_vector_encodings (dictionary/constant vectors -> BCP encoder)"
          # The archive list is ORDER-SENSITIVE on GNU ld and the order is wrong:
          # libmssql_extension.a is scanned before anything needs MssqlExtension,
          # so when libduckdb_static.a's generated_extension_loader.o gets pulled
          # (it references every statically-registered extension) the linker
          # cannot go back for the vtable and dies with
          #   undefined reference to `vtable for duckdb::MssqlExtension'
          # WHETHER it gets pulled depends on which objects the test happens to
          # reference -- it flaked on main after #254 and became deterministic on
          # the spec-068 branch when the tenant wiring shifted the symbol graph.
          # --start-group makes the resolution iterative, which is what macOS's
          # ld64 does by default (and why Darwin never failed).
          if [ "$(uname -s)" = "Darwin" ]; then
            PLATLIBS="-framework GSS -framework CoreFoundation -framework Security"
            GROUP_START=""
            GROUP_END=""
          else
            PLATLIBS="-ldl -lrt"
            GROUP_START="-Wl,--start-group"
            GROUP_END="-Wl,--end-group"
          fi
          "${CXX:-c++}" -std=c++17 -pthread -Wno-deprecated-declarations \
            -I src/include -I duckdb/src/include -I duckdb/third_party/fmt/include -I "$PREFIX/include" \
            test/cpp/test_vector_encodings.cpp \
            $GROUP_START \
            build/release/extension/mssql/libmssql_extension.a \
            build/release/src/libduckdb_static.a \
            $(find build/release/extension build/release/third_party -name '*.a' 2>/dev/null | grep -v mssql | tr '\n' ' ') \
            $GROUP_END \
            "$PREFIX/lib/libssl.a" "$PREFIX/lib/libcrypto.a" "$PREFIX/lib/libsimdutf.a" \
            $PLATLIBS \
            -o build/test/test_vector_encodings
          ./build/test/test_vector_encodings
          echo "::endgroup::"

          # spec 055: the staging structures. `make test-column-staging` existed
          # from the day they landed but nothing invoked it, so the whole staged
          # read path's unit test ran only on developer machines.
          echo "::group::test_column_staging"
          "${CXX:-c++}" -std=c++17 -pthread -Wno-deprecated-declarations \
            -I src/include -I duckdb/src/include -I duckdb/third_party/fmt/include -I "$PREFIX/include" \
            test/cpp/codec/test_column_staging.cpp \
            src/codec/staging/column_staging.cpp src/codec/staging/column_ops.cpp \
            src/tds/encoding/type_converter.cpp src/tds/tds_column_metadata.cpp \
            -L "$PREFIX/lib" -lsimdutf \
            -L build/release/src -lduckdb \
            -o build/test/test_column_staging
          LD_LIBRARY_PATH=build/release/src DYLD_LIBRARY_PATH=build/release/src ./build/test/test_column_staging
          echo "::endgroup::"

          # The staged ROW / NBCROW walks. A live server only sends NBCROW when
          # the null bitmap is cheaper than the NULL markers it replaces, so no
          # `.test` file had ever produced one — which is how the walk shipped
          # with an out-of-bounds read. These rows are synthetic and need no
          # server.
          #
          # Both go through the same script `make test-row-stager*` runs, so the
          # source list, sanitizer flags and ASAN_OPTIONS live in exactly one
          # place — a second copy here is precisely the drift the framing test
          # exists to catch. Neither is built with -DNDEBUG, on purpose: the
          # `D_ASSERT(p == end)` ending both walks IS the framing check.
          #
          # Sanitized on BOTH legs, deliberately: ASan hangs at process init on
          # Darwin 25.5 dev boxes — which is why `make test-row-stager*` passes
          # SANITIZE=0 there — but the macOS runner is older and runs it green,
          # so CI keeps coverage a dev box cannot have locally.
          echo "::group::test_row_stager (spec 059 D1b — ROW/NBCROW walks decoded)"
          ./test/cpp/codec/run_staging_test.sh \
            "$PREFIX" test/cpp/codec/test_row_stager.cpp build/release
          echo "::endgroup::"

          echo "::group::test_row_stager_framing (spec 055 T5 — staged walk vs RowReader)"
          ./test/cpp/codec/run_staging_test.sh \
            "$PREFIX" test/cpp/codec/test_row_stager_framing.cpp build/release
          echo "::endgroup::"

      # Spec 053 (#161): the shipped Linux extension must NOT hard-link the
      # Kerberos runtime, or it fails to LOAD on images without it. GSSAPI/krb5
      # are dlopen'd lazily, so they must be absent from DT_NEEDED.
      - name: Verify lazy Kerberos linking on the extension (no DT_NEEDED) [Linux]
        if: matrix.platform.os == 'linux'
        run: |
          EXT=build/release/extension/mssql/mssql.duckdb_extension
          echo "Dynamic dependencies of $EXT:"
          readelf -d "$EXT" | grep NEEDED || true
          if readelf -d "$EXT" | grep NEEDED | grep -iqE 'gssapi|krb5'; then
            echo "::error::Kerberos runtime is a hard (DT_NEEDED) dependency of the extension — issue #161 regression (spec 053)."
            exit 1
          fi
          echo "OK: no gssapi/krb5 in DT_NEEDED — extension loads without the Kerberos runtime installed."

      # The SAME list `make test-cpp` runs locally — STANDALONE_TEST_SOURCES —
      # rather than a hand-enumerated subset (job 1217). The lightweight "C++
      # Unit Tests" job earlier in this workflow compiles a handful of
      # libduckdb-free files for fast PR feedback; it cannot link the ones that
      # need the extension archive, so tests added to that list (e.g.
      # test_filter_encoder, test_statistics_provider) gated nothing until this
      # step existed. `test-cpp-run` skips the `release` prerequisite because the
      # archives were just built above.
      - name: Standalone C++ unit tests (make test-cpp-run)
        run: make test-cpp-run

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mssql-extension-${{ matrix.platform.id }}
          path: build/release/extension/mssql/mssql.duckdb_extension
          if-no-files-found: error

      - name: Upload DuckDB CLI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: duckdb-cli-${{ matrix.platform.id }}
          path: build/release/duckdb
          if-no-files-found: error

      - name: Upload unittest Artifact
        uses: actions/upload-artifact@v7
        with:
          name: unittest-${{ matrix.platform.id }}
          path: build/release/test/unittest
          if-no-files-found: error

      - name: Upload libduckdb Artifact (for unittest)
        uses: actions/upload-artifact@v7
        with:
          name: libduckdb-${{ matrix.platform.id }}
          path: |
            build/release/src/libduckdb.so
            build/release/src/libduckdb.dylib
          if-no-files-found: warn

  # ============================================================================
  # Smoke Test Job - Load-only test on all platforms
  # (Manual trigger only via workflow_dispatch)
  # ============================================================================
  smoke-test:
    name: Smoke Test (${{ matrix.platform.id }})
    runs-on: ${{ matrix.platform.runner }}
    needs: build
    # Follows the build on a merge to `main`: an extension that COMPILES can still
    # fail to LOAD (symbol visibility, a missing runtime dependency), and that is
    # the class this job exists for. One extra minute on top of a build that is
    # already running.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_build) || github.event_name == 'schedule' || github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux_amd64
            os: linux
            runner: ubuntu-22.04
            docker_available: true

          - id: osx_arm64
            os: osx
            runner: macos-14
            docker_available: false

    steps:
      - uses: actions/checkout@v7

      - name: Download extension artifact
        uses: actions/download-artifact@v8
        with:
          name: mssql-extension-${{ matrix.platform.id }}
          path: extension

      - name: Download DuckDB CLI artifact
        uses: actions/download-artifact@v8
        with:
          name: duckdb-cli-${{ matrix.platform.id }}
          path: cli

      - name: Setup executables
        run: |
          chmod +x cli/duckdb
          chmod +x scripts/ci/smoke_test.sh

      - name: Run load-only smoke test
        run: |
          scripts/ci/smoke_test.sh ./cli/duckdb ./extension/mssql.duckdb_extension

      - name: Log integration test status (non-Linux)
        if: matrix.platform.docker_available == false
        run: |
          echo "============================================"
          echo "Integration test skipped - Docker not available on ${{ matrix.platform.id }}"
          echo "Load-only smoke test passed successfully"
          echo "============================================"

  # ============================================================================
  # Integration Test Job - SQL Server tests on Linux only
  # Runs on the weekly schedule, and on workflow_dispatch when both run_build
  # and run_integration_tests are set. Runs the smoke test plus the full
  # SQLLogicTest suite (test/sql/**/*.test).
  # ============================================================================
  integration-test:
    name: Integration Test (linux_amd64)
    runs-on: ubuntu-22.04
    needs: build
    # On a merge to `main`, and on the pull request itself (issue #279): the suite
    # went from weekly to per-merge to per-PR, which is what makes a SQL
    # regression visible while the change is still a proposal rather than
    # history. Only worth having because the selection is fixed and floored —
    # this job used to report PASSED having run zero files (#212 gap 2).
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.run_build && inputs.run_integration_tests)
          || github.event_name == 'schedule'
          || github.event_name == 'push'
          || github.event_name == 'pull_request' }}

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: TestPassword1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P TestPassword1 -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v7

      - name: Download extension artifact
        uses: actions/download-artifact@v8
        with:
          name: mssql-extension-linux_amd64
          path: extension

      - name: Download DuckDB CLI artifact
        uses: actions/download-artifact@v8
        with:
          name: duckdb-cli-linux_amd64
          path: cli

      # The SQLLogicTest runner. The build job already produces and uploads it; this job just
      # never downloaded it, which is why no .test file has ever run in CI (issue #192).
      - name: Download unittest artifact
        uses: actions/download-artifact@v8
        with:
          name: unittest-linux_amd64
          path: unittest

      # DuckDB 2.0 links the unittest binary against the SHARED libduckdb
      # (@rpath); without the library next to it the binary does not start,
      # and the registered-tests guard sees an empty listing (its stderr is
      # deliberately swallowed). The build job has always uploaded this
      # artifact — the 1.5.x static link is why nothing ever consumed it.
      - name: Download libduckdb artifact
        uses: actions/download-artifact@v8
        with:
          name: libduckdb-linux_amd64
          path: lib

      - name: Setup executables
        run: |
          chmod +x cli/duckdb
          chmod +x unittest/unittest
          chmod +x scripts/ci/integration_test.sh

      - name: Wait for SQL Server
        run: |
          echo "Waiting for SQL Server to be ready..."
          timeout 120 bash -c 'until echo > /dev/tcp/localhost/1433 2>/dev/null; do sleep 5; done'
          echo "SQL Server is ready!"

      # The service container starts bare. Locally `make docker-up` runs an init container that
      # applies this script; the .test files expect the schema and seed rows it creates (TestDB
      # plus master.dbo.test), and fail without them.
      - name: Seed test database
        env:
          SQLSERVER_ID: ${{ job.services.sqlserver.id }}
        run: |
          # Seed from inside the service container rather than installing mssql-tools18 on
          # the runner. The image already ships /opt/mssql-tools18/bin/sqlcmd — the health
          # check above is that exact binary, so a healthy service proves it is present.
          #
          # The host-side install was worse than redundant: it added packages.microsoft.com
          # to apt, but the ubuntu-22.04 image already configures that same repo pinned to
          # /usr/share/keyrings/microsoft-prod.gpg. Two Signed-By values for one source makes
          # apt refuse to read *any* sources, so `apt-get update` exited 100 before installing
          # anything and the seed never ran (CI run #566). See #199.
          docker cp docker/init/init.sql "$SQLSERVER_ID:/tmp/init.sql"
          docker cp docker/init/init-transaction-tests.sql "$SQLSERVER_ID:/tmp/init-transaction-tests.sql"
          # No -b (exit-on-error): init.sql does not run cleanly even against a fresh server —
          # one AllDataTypes INSERT does DATEADD(day, id, col_datetime2) over a far-future seed
          # row and trips "Msg 517 ... datetime2 ... overflow", terminating that statement. This
          # is pre-existing and happens locally too (make docker-up prints it and carries on);
          # the suite passes without those rows. -b here would fail every run for a benign,
          # long-standing reason. integration_test.sh verifies the seed landed instead, so a
          # genuinely broken seed is still caught rather than silently skipped. See #199.
          docker exec "$SQLSERVER_ID" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P TestPassword1 -C -i /tmp/init.sql
          docker exec "$SQLSERVER_ID" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P TestPassword1 -C -i /tmp/init-transaction-tests.sql
          echo "Seed applied."

      - name: Run integration tests
        env:
          MSSQL_TEST_HOST: localhost
          MSSQL_TEST_PORT: 1433
          MSSQL_TEST_USER: sa
          MSSQL_TEST_PASS: TestPassword1
          MSSQL_TEST_DB: master
        run: |
          export LD_LIBRARY_PATH="$PWD/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          scripts/ci/integration_test.sh ./cli/duckdb ./extension/mssql.duckdb_extension ./unittest/unittest

  # ============================================================================
  # Windows Build Job - MSVC (Visual Studio 2022)
  # Matches community-extensions CI configuration
  # (Manual trigger only via workflow_dispatch)
  # ============================================================================
  build-windows-msvc:
    name: Build Windows (MSVC)
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_windows_build }}

    env:
      # Must be set explicitly: run-vcpkg otherwise forces the dead x-gha
      # provider on GitHub runners. Its own source says
      #   "Allow users to define the vcpkg's binary source explicitly in the
      #    workflow, in that case do not override it."
      #   setVariableIfUndefined(VCPKG_BINARY_SOURCES, 'clear;x-gha,readwrite')
      # so defining it here is the supported opt-out.
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite'

    steps:
      - uses: actions/checkout@v7

      - name: Checkout DuckDB submodule
        shell: bash
        run: |
          git submodule update --init --recursive duckdb

      - name: Log build metadata
        id: duckdb
        shell: bash
        run: |
          DUCKDB_COMMIT=$(git -C duckdb rev-parse HEAD)
          echo "commit=$DUCKDB_COMMIT" >> $GITHUB_OUTPUT
          echo "============================================"
          echo "Build Metadata"
          echo "============================================"
          echo "DuckDB Commit: $DUCKDB_COMMIT"
          echo "Platform: windows_amd64 (MSVC)"
          echo "vcpkg Triplet: x64-windows-static-release (matches community-extensions CI / extension-ci-tools main)"
          echo "============================================"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '65604f5075c64b18a84c30de400def13aad2e0ec'

      # Caches the binary-cache dir named by VCPKG_BINARY_SOURCES above, not
      # the install tree -- see the linux/macos build job for why the old
      # vcpkg/installed + vcpkg/packages paths never elided a rebuild.
      # Namespace is the vcpkg triplet, deliberately NOT job- or workflow-scoped:
      # release.yml's MSVC job uses the same triplet and shares this namespace.
      #
      # Caveat -- unlike the Linux/macOS namespaces, this one is NOT seeded
      # automatically. Both Windows jobs are gated on
      #   if: github.event_name == 'workflow_dispatch' && inputs.run_windows_build
      # so the weekly cron (which does seed x64-linux / arm64-osx from main)
      # never runs them. Only a manual main-branch dispatch with "Run Windows
      # build jobs" ticked writes a cache on refs/heads/main; until someone
      # does that, release.yml's MSVC job rebuilds OpenSSL from scratch on
      # every tag. Adding `|| github.event_name == 'schedule'` here would fix
      # that at the cost of two Windows builds per week on main.
      # See the linux/macos job for why the primary key carries github.run_id.
      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: vcpkg_bincache
          key: vcpkg-bincache-x64-windows-static-release-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bincache-x64-windows-static-release-

      - name: Setup Visual Studio Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/release
          Push-Location build/release
          cmake -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:RUNVCPKG_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-release `
            -DVCPKG_HOST_TRIPLET=x64-windows-static-release `
            -DVCPKG_MANIFEST_DIR="$(Get-Location)/../.." `
            -DDUCKDB_EXTENSION_CONFIGS="$(Get-Location)/../../extension_config.cmake" `
            ../../duckdb
          cmake --build . --config Release
          Pop-Location

      # Spec 068: the routing hop-driver test is a standalone compile (it is not
      # part of the CMake target set), and its fake TDS server is the only
      # Winsock code in the tree outside TdsSocket -- listen/accept/select/recv
      # behind #ifdef _WIN32, which nothing else would ever compile. It rides on
      # THIS job rather than the ungated cpp-unit-tests one because that job has
      # no vcpkg, and OpenSSL on a Windows runner would mean guessing at a
      # package location; here the prefix is already built above.
      # Consequence: Windows coverage of this test is dispatch-gated, unlike
      # Linux/macOS which run it on every PR.
      - name: Build + run login routing hop-driver test (spec 068)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Same pin file the Linux/macOS leg reads, so the two cannot drift.
          # -Raw matters: without it Get-Content emits one string PER LINE and
          # ConvertFrom-StringData runs per input, returning an array of
          # single-entry hashtables that only behaves like one hashtable through
          # member-access enumeration. ConvertFrom-StringData already skips '#'
          # comment lines, so no pre-filter is needed.
          $pin = Get-Content -Raw scripts/ci/simdutf_pin.env | ConvertFrom-StringData
          $expectedVer = $pin.SIMDUTF_EXPECTED_VER
          $expectedSha = $pin.SIMDUTF_EXPECTED_SHA
          $ver = (Get-Content vcpkg.json | ConvertFrom-Json).overrides `
                 | Where-Object { $_.name -eq "simdutf" } | Select-Object -ExpandProperty version
          if (-not $ver) {
            throw "vcpkg.json no longer overrides simdutf; see scripts/ci/simdutf_pin.env"
          }
          if ($ver -ne $expectedVer) {
            throw "vcpkg.json pins simdutf $ver but scripts/ci/simdutf_pin.env records $expectedVer. Record the new asset's SHA-256 in that file."
          }
          Write-Host "vcpkg.json pins simdutf $ver"
          New-Item -ItemType Directory -Force -Path simdutf_sh | Out-Null
          Invoke-WebRequest -Uri "https://github.com/simdutf/simdutf/releases/download/v$ver/singleheader.zip" `
            -OutFile simdutf_sh/singleheader.zip
          # ~100k lines of C++ get compiled into the test binary below; verify
          # the bytes before trusting them, exactly as the POSIX leg does.
          $actualSha = (Get-FileHash simdutf_sh/singleheader.zip -Algorithm SHA256).Hash
          if ($actualSha -ne $expectedSha.ToUpper()) {
            throw "simdutf singleheader.zip SHA-256 mismatch: got $actualSha, expected $($expectedSha.ToUpper())"
          }
          Expand-Archive -Force -Path simdutf_sh/singleheader.zip -DestinationPath simdutf_sh
          $prefix = "build/release/vcpkg_installed/x64-windows-static-release"
          cl /std:c++17 /EHsc /nologo /MT /D_WINSOCK_DEPRECATED_NO_WARNINGS `
            /I src/include /I simdutf_sh /I "$prefix/include" `
            test/cpp/test_login_routing_hops.cpp `
            src/tds/tds_connection.cpp src/tds/tds_socket.cpp `
            src/tds/tls/tds_tls_context.cpp src/tds/tls/tds_tls_impl.cpp `
            src/tds/tds_packet.cpp src/tds/tds_protocol.cpp src/tds/tds_types.cpp `
            src/tds/encoding/utf16.cpp simdutf_sh/simdutf.cpp `
            /Fe:test_login_routing_hops.exe `
            /link /LIBPATH:"$prefix/lib" libssl.lib libcrypto.lib ws2_32.lib crypt32.lib user32.lib advapi32.lib
          if ($LASTEXITCODE -ne 0) { throw "compile failed" }
          ./test_login_routing_hops.exe
          if ($LASTEXITCODE -ne 0) { throw "test failed" }

      # See the linux/macos build job for why the binary cache needs pruning.
      - name: Prune stale vcpkg binary archives
        if: always()
        shell: bash
        run: |
          [ -d vcpkg_bincache ] || exit 0
          echo "before: $(du -sh vcpkg_bincache | cut -f1)"
          find vcpkg_bincache -type f -mtime +14 -delete
          find vcpkg_bincache -mindepth 1 -type d -empty -delete
          echo "after:  $(du -sh vcpkg_bincache | cut -f1)"

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mssql-extension-windows_amd64_msvc
          path: build/release/extension/mssql/mssql.duckdb_extension
          if-no-files-found: error

      - name: Upload DuckDB CLI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: duckdb-cli-windows_amd64_msvc
          path: build/release/duckdb.exe
          if-no-files-found: error

  # ============================================================================
  # Windows Build Job - MinGW (Rtools 4.2)
  # Matches community-extensions CI configuration
  # (Manual trigger only via workflow_dispatch)
  # ============================================================================
  build-windows-mingw:
    name: Build Windows (MinGW)
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_windows_build }}
    env:
      CC: gcc
      CXX: g++
      # See the MSVC job: defining this is the supported way to stop run-vcpkg
      # forcing the removed x-gha provider.
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite'

    steps:
      - uses: actions/checkout@v7

      - name: Checkout DuckDB submodule
        shell: bash
        run: |
          git submodule update --init --recursive duckdb

      - name: Log build metadata
        id: duckdb
        shell: bash
        run: |
          DUCKDB_COMMIT=$(git -C duckdb rev-parse HEAD)
          echo "commit=$DUCKDB_COMMIT" >> $GITHUB_OUTPUT
          echo "============================================"
          echo "Build Metadata"
          echo "============================================"
          echo "DuckDB Commit: $DUCKDB_COMMIT"
          echo "Platform: windows_amd64 (MinGW)"
          echo "vcpkg Triplet: x64-mingw-static"
          echo "============================================"

      # Setup Rtools 4.2 for MinGW compiler
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'devel'
          update-rtools: true
          rtools-version: '42'

      - name: Setup rtools gcc for vcpkg
        shell: bash
        run: |
          cp C:/rtools42/x86_64-w64-mingw32.static.posix/bin/gcc.exe C:/rtools42/x86_64-w64-mingw32.static.posix/bin/x86_64-w64-mingw32-gcc.exe
          cp C:/rtools42/x86_64-w64-mingw32.static.posix/bin/g++.exe C:/rtools42/x86_64-w64-mingw32.static.posix/bin/x86_64-w64-mingw32-g++.exe
          echo "C:/rtools42/x86_64-w64-mingw32.static.posix/bin" >> $GITHUB_PATH
          echo "C:/rtools42/usr/bin" >> $GITHUB_PATH

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '65604f5075c64b18a84c30de400def13aad2e0ec'

      # Caches the binary-cache dir named by VCPKG_BINARY_SOURCES above. This
      # is the job that pays most for the old broken setup: run 29540869000
      # spent 6.9 min compiling OpenSSL for x64-mingw-static from scratch.
      # Same seeding caveat as the MSVC job above: this namespace only gets a
      # main-branch entry from a manual Windows dispatch, never from the cron.
      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: vcpkg_bincache
          key: vcpkg-bincache-x64-mingw-static-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bincache-x64-mingw-static-

      - name: Build Release
        shell: bash
        run: |
          mkdir -p build/release
          cd build/release
          cmake -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_TOOLCHAIN_FILE="$RUNVCPKG_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-mingw-static \
            -DVCPKG_HOST_TRIPLET=x64-mingw-static \
            -DVCPKG_MANIFEST_DIR="$(pwd)/../.." \
            -DDUCKDB_EXTENSION_CONFIGS="$(pwd)/../../extension_config.cmake" \
            ../../duckdb
          cmake --build . --config Release

      # See the linux/macos build job for why the binary cache needs pruning.
      - name: Prune stale vcpkg binary archives
        if: always()
        shell: bash
        run: |
          [ -d vcpkg_bincache ] || exit 0
          echo "before: $(du -sh vcpkg_bincache | cut -f1)"
          find vcpkg_bincache -type f -mtime +14 -delete
          find vcpkg_bincache -mindepth 1 -type d -empty -delete
          echo "after:  $(du -sh vcpkg_bincache | cut -f1)"

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mssql-extension-windows_amd64_mingw
          path: build/release/extension/mssql/mssql.duckdb_extension
          if-no-files-found: error

      - name: Upload DuckDB CLI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: duckdb-cli-windows_amd64_mingw
          path: build/release/duckdb.exe
          if-no-files-found: error

  # ============================================================================
  # Windows Smoke Test Job - Verify extension loads on Windows
  # (Manual trigger only via workflow_dispatch)
  # ============================================================================
  smoke-test-windows:
    name: Smoke Test Windows (${{ matrix.config.name }})
    runs-on: windows-latest
    needs: [build-windows-msvc, build-windows-mingw]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_windows_build }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: MSVC
            artifact_suffix: windows_amd64_msvc
          - name: MinGW
            artifact_suffix: windows_amd64_mingw

    steps:
      - uses: actions/checkout@v7

      - name: Download extension artifact
        uses: actions/download-artifact@v8
        with:
          name: mssql-extension-${{ matrix.config.artifact_suffix }}
          path: extension

      - name: Download DuckDB CLI artifact
        uses: actions/download-artifact@v8
        with:
          name: duckdb-cli-${{ matrix.config.artifact_suffix }}
          path: cli

      - name: Run load-only smoke test
        shell: bash
        run: |
          echo "Testing extension load for ${{ matrix.config.name }} build..."
          ./cli/duckdb.exe -unsigned -c "LOAD 'extension/mssql.duckdb_extension'; SELECT mssql_version();"
          echo "Smoke test passed!"

  # ============================================================================
  # Azure Test Job - Azure SQL Database and Fabric tests
  # Uses 'test' environment for secrets (AZURE_APP_ID, AZURE_APP_SECRET, etc.)
  # Runs DuckDB unittest with [azure] test group
  # (Manual trigger only via workflow_dispatch)
  # ============================================================================
  azure-test:
    name: Azure Test (linux_amd64)
    runs-on: ubuntu-22.04
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_build && inputs.run_azure_tests && github.ref != 'refs/heads/main' }}
    environment: test

    steps:
      - uses: actions/checkout@v7

      - name: Download unittest artifact
        uses: actions/download-artifact@v8
        with:
          name: unittest-linux_amd64
          path: test

      - name: Download libduckdb artifact
        uses: actions/download-artifact@v8
        with:
          name: libduckdb-linux_amd64
          path: lib

      - name: Download mssql extension artifact
        uses: actions/download-artifact@v8
        with:
          name: mssql-extension-linux_amd64
          path: extension

      - name: Download DuckDB CLI artifact
        uses: actions/download-artifact@v8
        with:
          name: duckdb-cli-linux_amd64
          path: cli

      - name: Setup executables
        run: |
          chmod +x test/unittest cli/duckdb

      # `--autoloading available` on its own is NOT enough, and is actively
      # worse than nothing here. In sqllogic_test_runner.cpp it sets
      # autoload_known_extensions=true, and with LOCAL_EXTENSION_REPO unset
      # local_extension_repo falls back to DUCKDB_BUILD_DIRECTORY/repository —
      # a path on the machine that BUILT the artifact, which does not exist in
      # this job. CheckRequire then takes the `INSTALL <ext> FROM '<repo>'`
      # branch for EVERY require, not just `require azure`, because neither
      # `mssql` nor anything else outside AUTOLOADABLE_EXTENSIONS is exempt.
      # So `require mssql` — the first line of every file in the group — fails
      # and all 20 cases skip. Reproduced exactly with an isolated HOME and no
      # repository: "All tests were skipped (total skipped 20) / require mssql: 20".
      #
      # Both are required together: LOCAL_EXTENSION_REPO alone leaves
      # autoloading_mode at NONE, and CheckRequire returns MISSING for any
      # excluded-from-autoloading extension in that mode. This is why
      # `make azure-test` sets both.
      - name: Provision local extension repository
        run: |
          set -euo pipefail
          # Install azure into a scratch HOME purely to learn the version and
          # platform directory names this build expects, and to obtain the
          # extension itself.
          scratch="$PWD/ci-ext-home"
          mkdir -p "$scratch"
          if ! HOME="$scratch" ./cli/duckdb -c "INSTALL azure;"; then
            echo "::error::Could not install the azure extension for this build." >&2
            echo "  Without it every file behind 'require azure' skips." >&2
            ./cli/duckdb -c "PRAGMA version;" >&2 || true
            echo "  The most likely cause here is that this is a dev-versioned build of" >&2
            echo "  duckdb/main: INSTALL then resolves to" >&2
            echo "    extensions.duckdb.org/<source_id>/<platform>/azure.duckdb_extension.gz" >&2
            echo "  which exists only if DuckDB's own extension CI published for that exact" >&2
            echo "  submodule commit. A submodule bump ahead of those publishes fails here" >&2
            echo "  for a reason unrelated to this extension -- pin the submodule to a SHA" >&2
            echo "  with published extensions, or build azure from source." >&2
            exit 1
          fi
          # NOT `v*/*/`. The directory is named by
          # ExtensionHelper::GetVersionDirectoryName(), which returns the
          # version tag only for a RELEASE build; for anything carrying `-dev`
          # it returns DuckDB::SourceID() -- a 10-char commit hash, which never
          # starts with `v`. The duckdb submodule is pinned to `branch = main`
          # and this workflow passes neither OVERRIDE_GIT_DESCRIBE nor
          # DUCKDB_EXPLICIT_VERSION, so `git describe` lands off-tag,
          # DUCKDB_VERSION becomes vX.Y.Z-devN and the hash is what gets used.
          # A `v*` glob matches nothing here and the step dies before running a
          # single test. It appeared to work locally only because a shallow
          # submodule clone stamps v0.0.1, which is release-shaped by accident.
          # $scratch is created fresh in this step, so exactly one directory is
          # expected; assert that rather than silently taking the first of
          # several. (The Makefile derives the name from the binary instead,
          # because build/release/repository is NOT cleaned between builds and
          # can hold a stale entry. Here the directory is new, so counting is
          # enough.)
          #
          # `dirs=$(...) || dirs=""`, not a pipeline into wc: under
          # `set -euo pipefail` an unmatched glob makes ls exit 2, pipefail
          # propagates it through wc/tr, and the assignment then aborts the step
          # via set -e -- before the diagnostic below could print, in exactly
          # the case it was written for. That is also why the extdir line has
          # its `|| true`.
          dirs=$(ls -d "$scratch"/.duckdb/extensions/*/*/ 2>/dev/null) || dirs=""
          found=$(printf '%s' "$dirs" | grep -c . || true)
          if [ "$found" -gt 1 ]; then
            echo "::error::expected one extension directory under $scratch, found $found:" >&2
            printf '%s\n' "$dirs" >&2
            exit 1
          fi
          extdir=$(printf '%s' "$dirs" | head -1)
          if [ -z "$extdir" ]; then
            echo "::error::INSTALL azure reported success but wrote no extension directory under $scratch/.duckdb/extensions" >&2
            ./cli/duckdb -c "PRAGMA version;" >&2 || true
            echo "  The install path is <version-dir>/<platform>/ where version-dir is the" >&2
            echo "  release tag for a release build and the source_id hash otherwise." >&2
            exit 1
          fi
          echo "Extension directory for this build: $extdir"
          plat=$(basename "$extdir")
          ver=$(basename "$(dirname "$extdir")")
          repo="$PWD/ext-repo/$ver/$plat"
          mkdir -p "$repo"
          cp "$extdir"/azure.duckdb_extension "$repo/"
          cp extension/mssql.duckdb_extension "$repo/"
          ls -l "$repo"
          echo "LOCAL_EXTENSION_REPO=$PWD/ext-repo" >> "$GITHUB_ENV"

      - name: Run Azure tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/lib
          AZURE_SQL_TEST_DSN: ${{ secrets.AZURE_SQL_TEST_DSN }}
          # azure_lazy_loading.test CREATEs/ALTERs/DROPs tables in `dbo`. The DSN
          # alone does not authorise that; this is the explicit second gate.
          AZURE_SQL_DDL_OK: "1"
          AZURE_APP_ID: ${{ secrets.AZURE_APP_ID }}
          AZURE_DIRECTORY_ID: ${{ secrets.AZURE_DIRECTORY_ID }}
          AZURE_APP_SECRET: ${{ secrets.AZURE_APP_SECRET }}
          AZURE_SQL_DB_HOST: ${{ secrets.AZURE_SQL_DB_HOST }}
          AZURE_SQL_DB: ${{ secrets.AZURE_SQL_DB }}
          # Fabric. The job has been titled "Azure SQL Database and Fabric tests"
          # since it was written while selecting only `[azure]` — and Catch tags
          # come from the parent DIRECTORY, so test/sql/fabric/fabric_types.test
          # is tagged `[fabric]` and was never selected. These three are what it
          # gates on, and nothing ever set them either, so Fabric had never been
          # exercised in any lane.
          AZURE_WH_HOST: ${{ secrets.AZURE_WH_HOST }}
          AZURE_WH_NAME: ${{ secrets.AZURE_WH_NAME }}
          AZURE_WH_TOKEN: ${{ secrets.AZURE_WH_TOKEN }}
          # A group where every file skips still prints "N test cases ... PASSED"
          # and exits 0 — which is how this job reported success for months while
          # running zero assertions. Same tripwire as MSSQL_MIN_TEST_CASES.
          # 60: the azure group alone measured 69 assertions on the first live
          # dispatch (2026-08-16). Fabric and the DSN-gated files are legitimate
          # skips when their secrets are absent, so the floor must fit the
          # azure-only shape; it exists to catch ALL-skip, not partial coverage.
          AZURE_MIN_ASSERTIONS: "60"
        run: |
          set -euo pipefail
          echo "============================================"
          echo "Running Azure Tests with unittest"
          echo "============================================"
          # A missing GitHub secret is not an unset variable: the secrets
          # expression yields '' and the env: block dutifully exports it — and a
          # SET-BUT-EMPTY variable satisfies `require-env`, so the gated test
          # RUNS with an empty substitution instead of skipping. That is exactly
          # how the first live dispatch failed: no AZURE_WH_TOKEN secret in the
          # environment -> fabric_types.test ran with ACCESS_TOKEN '' -> the
          # attach fell through to SQL auth -> "Missing 'User Id'". The Makefile
          # lane already exports only non-empty values; this is the job-side
          # equivalent. (${!v} indirection, not eval: a DSN value contains ';',
          # which eval would execute as a command separator.)
          for v in AZURE_APP_ID AZURE_DIRECTORY_ID AZURE_APP_SECRET \
                   AZURE_SQL_DB_HOST AZURE_SQL_DB AZURE_SQL_TEST_DSN \
                   AZURE_WH_HOST AZURE_WH_NAME AZURE_WH_TOKEN; do
            if [ -z "${!v:-}" ]; then
              unset "$v"
              echo "$v: absent — its tests will skip"
            else
              echo "$v: set"
            fi
          done

          # AZURE_ACCESS_TOKEN is deliberately NOT a stored secret: a bearer
          # token for https://database.windows.net/ expires in about an hour, so
          # a static copy is stale by the second dispatch. Mint one from the
          # service-principal credentials that are already here; if that fails,
          # say so and let the token tests skip rather than run with garbage.
          if [ -n "${AZURE_APP_ID:-}" ] && [ -n "${AZURE_APP_SECRET:-}" ] && [ -n "${AZURE_DIRECTORY_ID:-}" ]; then
            token=$(curl -s --fail -X POST "https://login.microsoftonline.com/${AZURE_DIRECTORY_ID}/oauth2/v2.0/token" \
              --data-urlencode "grant_type=client_credentials" \
              --data-urlencode "client_id=${AZURE_APP_ID}" \
              --data-urlencode "client_secret=${AZURE_APP_SECRET}" \
              --data-urlencode "scope=https://database.windows.net/.default" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin).get("access_token",""))' || true)
            if [ -n "$token" ]; then
              export AZURE_ACCESS_TOKEN="$token"
              echo "AZURE_ACCESS_TOKEN: minted from the service principal (${#token} chars)"
            else
              echo "AZURE_ACCESS_TOKEN: could not mint from the service principal — token tests will skip"
            fi
          fi
          echo "LD_LIBRARY_PATH: $LD_LIBRARY_PATH"
          echo "============================================"

          # LOCAL_EXTENSION_REPO comes from the provisioning step above and
          # holds both mssql and azure; --autoloading available is what lets
          # CheckRequire use it at all. Neither works without the other — see
          # the comment on that step. Both `[azure]` and `[fabric]` are
          # selected; the tag is the directory name, not the `# group:` header.
          echo "LOCAL_EXTENSION_REPO: ${LOCAL_EXTENSION_REPO:-<unset>}"

          # Warm the serverless database. A free/serverless Azure SQL DB
          # auto-pauses on idle and answers its first logins with 40613
          # ("not currently available") for 20-60 s while it resumes — which
          # otherwise lands inside the suite and fails whichever test attaches
          # first. Best-effort: if it never wakes, the suite fails with the
          # real 40613 and the message says to retry.
          if [ -n "${AZURE_SQL_TEST_DSN:-}" ]; then
            for i in 1 2 3 4 5 6; do
              if ./cli/duckdb -c "ATTACH '${AZURE_SQL_TEST_DSN}' AS wake (TYPE mssql); SELECT 1;" >/dev/null 2>&1; then
                echo "serverless database awake (attempt $i)"; break
              fi
              echo "waking the serverless database (attempt $i; 40613 while it resumes is expected)..."
              sleep 20
            done
          fi
          ./test/unittest "[azure],[fabric]" --autoloading available --force-reload 2>&1 | tee azure-tests.out

          asserts=$(grep -oE '[0-9]+ assertions?' azure-tests.out | tail -1 | grep -oE '^[0-9]+' || true)
          if [ -z "$asserts" ]; then
            echo "azure-test: could not read an assertion count — the suite did not report" >&2
            exit 1
          fi
          if [ "$asserts" -lt "$AZURE_MIN_ASSERTIONS" ]; then
            echo "azure-test: only $asserts assertions ran, expected at least $AZURE_MIN_ASSERTIONS." >&2
            echo "  Every file skipping still exits 0. Check that 'require azure' resolved" >&2
            echo "  and that the AZURE_* secrets above are actually populated." >&2
            exit 1
          fi
          echo "Azure tests completed! ($asserts assertions, floor $AZURE_MIN_ASSERTIONS)"
