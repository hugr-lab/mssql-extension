name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Docs-only PRs skip CI (lint + C++ unit tests). Prose-scanning workflows
    # (prompt-injection, secret scan) have their own triggers and still run.
    # NOTE: if Lint / "C++ Unit Tests" are required status checks, GitHub treats
    # a path-skipped required check as pending and can block docs PRs — either
    # mark them non-required or add a passing stub. See PR description.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  schedule:
    # Weekly regression build (Mondays 05:00 UTC). The heavy build job is
    # manual-dispatch only, so without this the C++ unit tests it carries
    # (incl. test_login_error_state, issue #164) and the integration suite get
    # no automatic coverage between releases. Runs build + smoke + integration;
    # Windows / Azure stay manual (cost, and #165 keeps MSVC red).
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      run_build:
        description: 'Run build and tests'
        required: false
        default: false
        type: boolean
      run_integration_tests:
        description: 'Run SQL Server integration tests (requires run_build)'
        required: false
        default: true
        type: boolean
      run_windows_build:
        description: 'Run Windows builds (MSVC and MinGW)'
        required: false
        default: false
        type: boolean
      run_azure_tests:
        description: 'Run Azure SQL/Fabric tests (requires run_build, use on feature branches only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # SQL Server test environment
  MSSQL_TEST_HOST: localhost
  MSSQL_TEST_PORT: 1433
  MSSQL_TEST_USER: sa
  MSSQL_TEST_PASS: TestPassword1
  MSSQL_TEST_DB: master

jobs:
  # ============================================================================
  # Lint Job - Check code formatting (runs on merge to main)
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14
          find src -name '*.cpp' -o -name '*.hpp' | xargs clang-format-14 --dry-run --Werror

      # Spec 063 D7. A sqllogictest file whose require-env variable is unset does
      # not fail — it SKIPS, and the run reports success. Spec 057 found that
      # class three times in one spec (MSSQL_TEST_SERVER hid 4 files,
      # MSSQL_TEST_CONNECTION_STRING 4 more including both auto-TABLOCK tests,
      # and a filter matching nothing hid 164). This is what makes the fourth a
      # build failure instead of a green run. No build needed — it reads files.
      - name: Every require-env variable is actually set
        run: scripts/ci/check_require_env.sh

  # ============================================================================
  # C++ Unit Tests Job - lightweight, no SQL Server / DuckDB build required.
  # Runs on every push/PR (unlike the heavy build job, which is manual).
  # Spec 053 (#161): guards the lazy GSSAPI/krb5 linking so the regression
  # cannot return — the shim must compile and add NO hard DT_NEEDED on the
  # Kerberos runtime.
  # ============================================================================
  cpp-unit-tests:
    name: C++ Unit Tests (${{ matrix.os.id }})
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - id: linux
            runner: ubuntu-latest
          - id: macos
            runner: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install Kerberos dev headers (Linux)
        if: matrix.os.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev binutils pkg-config

      - name: Build + run gssapi_runtime loader unit test (spec 053)
        run: |
          if [ "${{ matrix.os.id }}" = "macos" ]; then
            clang++ -std=c++17 -pthread -DMSSQL_ENABLE_KRB5=1 -I src/include \
              test/cpp/test_gssapi_runtime.cpp src/tds/auth/gssapi_runtime.cpp \
              -framework GSS -o /tmp/test_gssapi_runtime
          else
            g++ -std=c++17 -pthread -DMSSQL_ENABLE_KRB5=1 -I src/include \
              $(pkg-config --cflags krb5-gssapi krb5) \
              test/cpp/test_gssapi_runtime.cpp src/tds/auth/gssapi_runtime.cpp \
              -ldl -o /tmp/test_gssapi_runtime
          fi
          /tmp/test_gssapi_runtime

      - name: Assert shim has no Kerberos DT_NEEDED (Linux)
        if: matrix.os.id == 'linux'
        run: |
          echo "Dynamic deps of the shim test binary (must NOT list gssapi/krb5):"
          readelf -d /tmp/test_gssapi_runtime | grep NEEDED || true
          if readelf -d /tmp/test_gssapi_runtime | grep NEEDED | grep -iqE 'gssapi|krb5'; then
            echo "::error::shim links the Kerberos runtime at load time — issue #161 regression (spec 053)."
            exit 1
          fi
          echo "OK: shim resolves GSSAPI/krb5 lazily via dlopen; no hard dependency."

      # Spec 049 (#85): the catalog records the target's physical shape, but
      # nothing consumes it until the write path lands. This is what would
      # notice the sys.indexes.type mapping being renumbered or inverted —
      # in particular type 5 (clustered COLUMNSTORE), which reports index_id 1
      # exactly like a rowstore index but wants the opposite TABLOCK answer.
      # Self-contained header: no submodule checkout, nothing to link.
      - name: Build + run MSSQLIndexKind unit test (spec 049)
        run: |
          c++ -std=c++17 -pthread -I src/include \
            test/cpp/test_index_kind.cpp -o /tmp/test_index_kind
          /tmp/test_index_kind

      # Spec 063 D1: who supplies a bulk-load writer's connection and how many
      # writers there may be. Every case it decides fails SILENTLY when wrong —
      # a writer given the pinned connection interleaves ROW tokens into someone
      # else's bulk load; a second writer inside a transaction lands rows that do
      # not roll back; a second writer against a `#temp` target writes to whatever
      # same-named table that pooled session holds. An end-to-end test sees a load
      # that succeeded, so the policy is asserted directly.
      # Self-contained header: no submodule checkout, nothing to link.
      - name: Build + run load-policy unit test (spec 063)
        run: |
          c++ -std=c++17 -pthread -I src/include \
            test/cpp/test_load_policy.cpp -o /tmp/test_load_policy
          /tmp/test_load_policy

  # ============================================================================
  # Build Job - Build against DuckDB stable on representative platforms
  # (Manual trigger only via workflow_dispatch)
  # ============================================================================
  build:
    name: Build (${{ matrix.platform.id }})
    runs-on: ${{ matrix.platform.runner }}
    # Also on a merge to `main` (issue #212 gap 1). A pull request never compiled
    # the extension, so a C++ regression could reach main behind green checks —
    # three times in one week when that issue was filed. Building on the merge
    # catches it on main rather than at the next release, and costs nothing on
    # the PRs themselves: the `push` trigger is `branches: [main]` and the
    # workflow's `paths-ignore` keeps docs-only merges free.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_build) || github.event_name == 'schedule' || github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux x86_64 - with Docker support for integration tests
          - id: linux_amd64
            os: linux
            arch: amd64
            runner: ubuntu-22.04
            docker_available: true
            vcpkg_triplet: x64-linux

          # macOS ARM64 - load-only testing
          - id: osx_arm64
            os: osx
            arch: arm64
            runner: macos-14
            docker_available: false
            vcpkg_triplet: arm64-osx

    env:
      # Send vcpkg's binary cache to a directory actions/cache persists (see
      # the "Cache vcpkg binary packages" step). Without this, vcpkg falls back
      # to its default files provider under $HOME/.cache/vcpkg/archives, which
      # nothing caches -- so every run rebuilt OpenSSL from source.
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite'

    steps:
      - uses: actions/checkout@v7

      - name: Checkout DuckDB submodule
        run: |
          git submodule update --init --recursive duckdb

      - name: Log build metadata
        id: duckdb
        run: |
          DUCKDB_COMMIT=$(git -C duckdb rev-parse HEAD)
          DUCKDB_BRANCH=$(git -C duckdb branch --show-current 2>/dev/null || git config -f .gitmodules submodule.duckdb.branch 2>/dev/null || echo "unknown")
          echo "commit=$DUCKDB_COMMIT" >> $GITHUB_OUTPUT
          echo "============================================"
          echo "Build Metadata"
          echo "============================================"
          echo "DuckDB Branch: $DUCKDB_BRANCH"
          echo "DuckDB Commit: $DUCKDB_COMMIT"
          echo "Platform: ${{ matrix.platform.id }}"
          echo "Runner: ${{ matrix.platform.runner }}"
          echo "============================================"

      - name: Setup Ninja
        run: |
          if [ "${{ matrix.platform.os }}" = "osx" ]; then
            brew install ninja ccache
          else
            sudo apt-get update
            # libkrb5-dev enables the integrated-auth (Kerberos) build path so
            # the shipped artifact contains the spec 053 dlopen shim; the
            # readelf guard below then verifies it carries no hard DT_NEEDED.
            sudo apt-get install -y ninja-build ccache libkrb5-dev
          fi

      # Cache ccache to speed up compilation
      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.platform.id }}-${{ steps.duckdb.outputs.commit }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.platform.id }}-${{ steps.duckdb.outputs.commit }}-
            ccache-${{ matrix.platform.id }}-

      - name: Configure ccache
        run: |
          # 2G (was 500M): a full DuckDB object set overflows 500M and evicts
          # itself mid-build, so warm runs were partially cold. 2G holds the
          # DuckDB + extension objects across runs for a much higher hit rate.
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache -z

      - name: Setup vcpkg
        run: |
          if [ ! -d "vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git
            ./vcpkg/bootstrap-vcpkg.sh
          fi

      # Cache vcpkg's BINARY cache (the archives dir), not the install tree.
      #
      # The previous version cached vcpkg/installed + vcpkg/packages +
      # vcpkg/buildtrees, which never worked: in manifest mode vcpkg installs
      # into build/release/vcpkg_installed and looks for prebuilt archives in
      # its binary cache, so none of those three paths were ever consulted.
      # Runs 29339658347 and 29345077972 both logged
      #   "Cache restored from key: vcpkg-x64-linux-..."   (a HIT)
      #   "Building openssl:x64-linux@3.4.1..."            (rebuilt anyway)
      # i.e. ~2 min of OpenSSL rebuild per run despite a green cache hit.
      #
      # Pointing VCPKG_BINARY_SOURCES at a `files` dir and caching THAT dir is
      # what actually elides the rebuild. Archives are keyed by vcpkg's ABI
      # hash, so a stale restore can't produce a wrong binary -- vcpkg simply
      # misses and rebuilds. That makes the prefix restore-key safe.
      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: vcpkg_bincache
          # The primary key MUST be unique per run. actions/cache skips the
          # post-run save on an exact primary-key hit (saveImpl.ts: "Cache hit
          # occurred on the primary key ..., not saving cache."). With a stable
          # key the cache would freeze after the first save: once the ABI hash
          # drifts -- a runner-image compiler bump, or vcpkg master churn, since
          # the clone above is unpinned -- vcpkg would rebuild every run and the
          # fresh archives would never be persisted. That is the same silent
          # no-op this whole change exists to kill.
          #
          # hashFiles('vcpkg.json') is kept only as a readable namespace marker;
          # it is NOT sufficient on its own, because vcpkg.json's `version` is
          # the extension's own version (rotates for the wrong reason) and it
          # says nothing about compiler/triplet/vcpkg-tool (fails to rotate for
          # the right one). The prefix restore-key below is what actually seeds
          # each run, and it matches across hashes.
          key: vcpkg-bincache-${{ matrix.platform.vcpkg_triplet }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bincache-${{ matrix.platform.vcpkg_triplet }}-

      - name: Build Release
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          mkdir -p build/release
          cd build/release
          cmake -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_TOOLCHAIN_FILE="$(pwd)/../../vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_DIR="$(pwd)/../.." \
            -DDUCKDB_EXTENSION_CONFIGS="$(pwd)/../../extension_config.cmake" \
            ../../duckdb
          cmake --build . --config Release

      # actions/cache restores the previous generation's archives and vcpkg
      # only ever adds to them, so without pruning this dir grows monotonically:
      # ABI-named archives from superseded compilers / vcpkg baselines are never
      # evicted, and each run's save carries the whole pile forward. Left alone
      # it eats GitHub's 10 GB per-repo cache budget, at which point LRU starts
      # silently dropping *other* caches (ccache, DuckDB). Runs before the
      # post-job save; always() so a failed build still saves a pruned dir.
      - name: Prune stale vcpkg binary archives
        if: always()
        shell: bash
        run: |
          [ -d vcpkg_bincache ] || exit 0
          echo "before: $(du -sh vcpkg_bincache | cut -f1)"
          find vcpkg_bincache -type f -mtime +14 -delete
          find vcpkg_bincache -mindepth 1 -type d -empty -delete
          echo "after:  $(du -sh vcpkg_bincache | cut -f1)"

      - name: Show ccache stats
        run: ccache -s

      # Standalone C++ unit tests (test/cpp/*) — pure in-memory, no SQL Server.
      # Reuses the simdutf already built by vcpkg for the release tree.
      - name: Run C++ unit tests
        run: |
          set -euo pipefail
          PREFIX="build/release/vcpkg_installed/${{ matrix.platform.vcpkg_triplet }}"
          if [ ! -f "$PREFIX/include/simdutf.h" ]; then
            echo "simdutf not found under $PREFIX" >&2
            ls -R build/release/vcpkg_installed 2>/dev/null | head -50 >&2 || true
            exit 1
          fi
          mkdir -p build/test
          echo "::group::test_login7_encoding (spec 043 + issue #138 LOGIN7 fragmentation)"
          "${CXX:-c++}" -std=c++17 -pthread -Wno-deprecated-declarations -DMSSQL_BENCH_BUILD \
            -I src/include -I duckdb/src/include -I "$PREFIX/include" \
            test/cpp/test_login7_encoding.cpp \
            src/tds/tds_packet.cpp src/tds/tds_protocol.cpp src/tds/tds_types.cpp src/tds/encoding/utf16.cpp \
            -L "$PREFIX/lib" -lsimdutf \
            -o build/test/test_login7_encoding
          ./build/test/test_login7_encoding
          echo "::endgroup::"

          echo "::group::test_login_error_state (issue #164 — capture LOGIN7 18456 State byte)"
          # TDS-only, like test_login7_encoding above: no libduckdb, just the
          # protocol parser. Pins LoginResponse::error_state so 18456 failures
          # surface the State that distinguishes bad password from inaccessible db.
          "${CXX:-c++}" -std=c++17 -pthread -Wno-deprecated-declarations \
            -I src/include -I duckdb/src/include -I "$PREFIX/include" \
            test/cpp/test_login_error_state.cpp \
            src/tds/tds_packet.cpp src/tds/tds_protocol.cpp src/tds/tds_types.cpp src/tds/encoding/utf16.cpp \
            -L "$PREFIX/lib" -lsimdutf \
            -o build/test/test_login_error_state
          ./build/test/test_login_error_state
          echo "::endgroup::"

          echo "::group::test_datetime_codec (codec::datetime — issue #168 datetime2(7) overflow -> NULL)"
          # Unlike the TDS-only test above, the codec test uses DuckDB
          # Value/Vector/Date/Timestamp, so it links the libduckdb just built in
          # this job (build/release/src). Mirrors the Makefile `test-codec-datetime`
          # recipe: all src/codec/*.cpp + the encoding helpers, -lsimdutf -lduckdb.
          "${CXX:-c++}" -std=c++17 -pthread -Wno-deprecated-declarations \
            -I src/include -I duckdb/src/include -I "$PREFIX/include" \
            test/cpp/codec/test_datetime_codec.cpp \
            src/codec/*.cpp \
            src/tds/encoding/utf16.cpp src/tds/encoding/datetime_encoding.cpp \
            src/tds/encoding/decimal_encoding.cpp src/tds/encoding/guid_encoding.cpp \
            -L "$PREFIX/lib" -lsimdutf \
            -L build/release/src -lduckdb \
            -o build/test/test_datetime_codec
          LD_LIBRARY_PATH=build/release/src DYLD_LIBRARY_PATH=build/release/src ./build/test/test_datetime_codec
          echo "::endgroup::"

          # Three unit tests that were in the tree but built by NOTHING — not
          # CMake, not the Makefile, not this workflow. Nobody compiled them,
          # so nobody noticed the code moving underneath: HUGEINT and INTERVAL
          # were still asserted "unsupported" after spec 045 gave them
          # DECIMAL(38,0) and NVARCHAR(50), TIMESTAMP was still DATETIME2(7),
          # an identifier-quoting case had one bracket too many, and the LIKE
          # conversion tests predated underscore escaping. All four were wrong
          # about the CODE, not the other way round.
          for t in test_ddl_translator test_ctas_type_mapping test_catalog_filter; do
            case "$t" in
              test_catalog_filter) EXTRA="src/catalog/mssql_catalog_filter.cpp" ;;
              *)                   EXTRA="src/catalog/mssql_ddl_translator.cpp" ;;
            esac
            echo "::group::${t}"
            "${CXX:-c++}" -std=c++17 -pthread -Wno-deprecated-declarations \
              -I src/include -I duckdb/src/include -I "$PREFIX/include" \
              "test/cpp/${t}.cpp" src/codec/*.cpp $EXTRA \
              src/tds/encoding/utf16.cpp src/tds/encoding/decimal_encoding.cpp \
              src/tds/encoding/guid_encoding.cpp src/tds/encoding/datetime_encoding.cpp \
              src/tds/encoding/bcp_row_encoder.cpp \
              -L "$PREFIX/lib" -lsimdutf \
              -L build/release/src -lduckdb \
              -o "build/test/${t}"
            LD_LIBRARY_PATH=build/release/src DYLD_LIBRARY_PATH=build/release/src "./build/test/${t}"
            echo "::endgroup::"
          done

          # spec 054: run the remaining per-family codec unit tests. Only
          # datetime ran in CI before, so the #177 HUGEINT guard and the W1
          # dictionary/constant fixes had no CI coverage. Same link set as
          # `make test-codec-<fam>`, plus bcp_row_encoder.cpp — integer/decimal
          # EncodeToBcp call BCPRowEncoder::EncodeDecimal, defined there.
          for fam in boolean integer float decimal string binary uuid money; do
            echo "::group::test_${fam}_codec"
            "${CXX:-c++}" -std=c++17 -pthread -Wno-deprecated-declarations \
              -I src/include -I duckdb/src/include -I "$PREFIX/include" \
              "test/cpp/codec/test_${fam}_codec.cpp" \
              src/codec/*.cpp \
              src/tds/encoding/utf16.cpp src/tds/encoding/datetime_encoding.cpp \
              src/tds/encoding/decimal_encoding.cpp src/tds/encoding/guid_encoding.cpp \
              src/tds/encoding/bcp_row_encoder.cpp \
              -L "$PREFIX/lib" -lsimdutf \
              -L build/release/src -lduckdb \
              -o "build/test/test_${fam}_codec"
            LD_LIBRARY_PATH=build/release/src DYLD_LIBRARY_PATH=build/release/src "./build/test/test_${fam}_codec"
            echo "::endgroup::"
          done

          # PR #245: dictionary/constant vectors through the BCP encoder,
          # constructed explicitly. The SQL twin (vector_encodings_bcp.test)
          # relies on the parquet reader / storage layer CHOOSING dictionary
          # encoding and would keep passing if they stopped; this one cannot go
          # vacuous. Needs Vector/DataChunk plus the encoder's full dependency
          # cone (BCPColumnMetadata methods live in target_resolver.cpp, which
          # pulls catalog/connection/TLS), so it links the just-built static
          # archives exactly like `make test-cpp` does.
          echo "::group::test_vector_encodings (dictionary/constant vectors -> BCP encoder)"
          if [ "$(uname -s)" = "Darwin" ]; then
            PLATLIBS="-framework GSS -framework CoreFoundation -framework Security"
          else
            PLATLIBS="-ldl -lrt"
          fi
          "${CXX:-c++}" -std=c++17 -pthread -Wno-deprecated-declarations \
            -I src/include -I duckdb/src/include -I "$PREFIX/include" \
            test/cpp/test_vector_encodings.cpp \
            build/release/extension/mssql/libmssql_extension.a \
            build/release/src/libduckdb_static.a \
            $(find build/release/extension build/release/third_party -name '*.a' 2>/dev/null | grep -v mssql | tr '\n' ' ') \
            build/release/src/libduckdb_static.a \
            "$PREFIX/lib/libssl.a" "$PREFIX/lib/libcrypto.a" "$PREFIX/lib/libsimdutf.a" \
            $PLATLIBS \
            -o build/test/test_vector_encodings
          ./build/test/test_vector_encodings
          echo "::endgroup::"

          # spec 055: the staging structures. `make test-column-staging` existed
          # from the day they landed but nothing invoked it, so the whole staged
          # read path's unit test ran only on developer machines.
          echo "::group::test_column_staging"
          "${CXX:-c++}" -std=c++17 -pthread -Wno-deprecated-declarations \
            -I src/include -I duckdb/src/include -I "$PREFIX/include" \
            test/cpp/codec/test_column_staging.cpp \
            src/codec/staging/column_staging.cpp src/codec/staging/column_ops.cpp \
            src/tds/encoding/type_converter.cpp src/tds/tds_column_metadata.cpp \
            -L "$PREFIX/lib" -lsimdutf \
            -L build/release/src -lduckdb \
            -o build/test/test_column_staging
          LD_LIBRARY_PATH=build/release/src DYLD_LIBRARY_PATH=build/release/src ./build/test/test_column_staging
          echo "::endgroup::"

          # The staged ROW / NBCROW walks. A live server only sends NBCROW when
          # the null bitmap is cheaper than the NULL markers it replaces, so no
          # `.test` file had ever produced one — which is how the walk shipped
          # with an out-of-bounds read. These rows are synthetic and need no
          # server.
          #
          # Both go through the same script `make test-row-stager*` runs, so the
          # source list, sanitizer flags and ASAN_OPTIONS live in exactly one
          # place — a second copy here is precisely the drift the framing test
          # exists to catch. Neither is built with -DNDEBUG, on purpose: the
          # `D_ASSERT(p == end)` ending both walks IS the framing check.
          #
          # Sanitized on BOTH legs, deliberately: ASan hangs at process init on
          # Darwin 25.5 dev boxes — which is why `make test-row-stager*` passes
          # SANITIZE=0 there — but the macOS runner is older and runs it green,
          # so CI keeps coverage a dev box cannot have locally.
          echo "::group::test_row_stager (spec 059 D1b — ROW/NBCROW walks decoded)"
          ./test/cpp/codec/run_staging_test.sh \
            "$PREFIX" test/cpp/codec/test_row_stager.cpp build/release
          echo "::endgroup::"

          echo "::group::test_row_stager_framing (spec 055 T5 — staged walk vs RowReader)"
          ./test/cpp/codec/run_staging_test.sh \
            "$PREFIX" test/cpp/codec/test_row_stager_framing.cpp build/release
          echo "::endgroup::"

      # Spec 053 (#161): the shipped Linux extension must NOT hard-link the
      # Kerberos runtime, or it fails to LOAD on images without it. GSSAPI/krb5
      # are dlopen'd lazily, so they must be absent from DT_NEEDED.
      - name: Verify lazy Kerberos linking on the extension (no DT_NEEDED) [Linux]
        if: matrix.platform.os == 'linux'
        run: |
          EXT=build/release/extension/mssql/mssql.duckdb_extension
          echo "Dynamic dependencies of $EXT:"
          readelf -d "$EXT" | grep NEEDED || true
          if readelf -d "$EXT" | grep NEEDED | grep -iqE 'gssapi|krb5'; then
            echo "::error::Kerberos runtime is a hard (DT_NEEDED) dependency of the extension — issue #161 regression (spec 053)."
            exit 1
          fi
          echo "OK: no gssapi/krb5 in DT_NEEDED — extension loads without the Kerberos runtime installed."

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mssql-extension-${{ matrix.platform.id }}
          path: build/release/extension/mssql/mssql.duckdb_extension
          if-no-files-found: error

      - name: Upload DuckDB CLI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: duckdb-cli-${{ matrix.platform.id }}
          path: build/release/duckdb
          if-no-files-found: error

      - name: Upload unittest Artifact
        uses: actions/upload-artifact@v7
        with:
          name: unittest-${{ matrix.platform.id }}
          path: build/release/test/unittest
          if-no-files-found: error

      - name: Upload libduckdb Artifact (for unittest)
        uses: actions/upload-artifact@v7
        with:
          name: libduckdb-${{ matrix.platform.id }}
          path: |
            build/release/src/libduckdb.so
            build/release/src/libduckdb.dylib
          if-no-files-found: warn

  # ============================================================================
  # Smoke Test Job - Load-only test on all platforms
  # (Manual trigger only via workflow_dispatch)
  # ============================================================================
  smoke-test:
    name: Smoke Test (${{ matrix.platform.id }})
    runs-on: ${{ matrix.platform.runner }}
    needs: build
    # Follows the build on a merge to `main`: an extension that COMPILES can still
    # fail to LOAD (symbol visibility, a missing runtime dependency), and that is
    # the class this job exists for. One extra minute on top of a build that is
    # already running.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_build) || github.event_name == 'schedule' || github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux_amd64
            os: linux
            runner: ubuntu-22.04
            docker_available: true

          - id: osx_arm64
            os: osx
            runner: macos-14
            docker_available: false

    steps:
      - uses: actions/checkout@v7

      - name: Download extension artifact
        uses: actions/download-artifact@v8
        with:
          name: mssql-extension-${{ matrix.platform.id }}
          path: extension

      - name: Download DuckDB CLI artifact
        uses: actions/download-artifact@v8
        with:
          name: duckdb-cli-${{ matrix.platform.id }}
          path: cli

      - name: Setup executables
        run: |
          chmod +x cli/duckdb
          chmod +x scripts/ci/smoke_test.sh

      - name: Run load-only smoke test
        run: |
          scripts/ci/smoke_test.sh ./cli/duckdb ./extension/mssql.duckdb_extension

      - name: Log integration test status (non-Linux)
        if: matrix.platform.docker_available == false
        run: |
          echo "============================================"
          echo "Integration test skipped - Docker not available on ${{ matrix.platform.id }}"
          echo "Load-only smoke test passed successfully"
          echo "============================================"

  # ============================================================================
  # Integration Test Job - SQL Server tests on Linux only
  # Runs on the weekly schedule, and on workflow_dispatch when both run_build
  # and run_integration_tests are set. Runs the smoke test plus the full
  # SQLLogicTest suite (test/sql/**/*.test).
  # ============================================================================
  integration-test:
    name: Integration Test (linux_amd64)
    runs-on: ubuntu-22.04
    needs: build
    # On a merge to `main` as well: the suite went from weekly to per-merge, which
    # is what makes a SQL regression visible while the change is still fresh.
    # Only worth having because the selection is fixed — this job used to report
    # PASSED having run zero files (#212 gap 2).
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_build && inputs.run_integration_tests) || github.event_name == 'schedule' || github.event_name == 'push' }}

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: TestPassword1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P TestPassword1 -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v7

      - name: Download extension artifact
        uses: actions/download-artifact@v8
        with:
          name: mssql-extension-linux_amd64
          path: extension

      - name: Download DuckDB CLI artifact
        uses: actions/download-artifact@v8
        with:
          name: duckdb-cli-linux_amd64
          path: cli

      # The SQLLogicTest runner. The build job already produces and uploads it; this job just
      # never downloaded it, which is why no .test file has ever run in CI (issue #192).
      - name: Download unittest artifact
        uses: actions/download-artifact@v8
        with:
          name: unittest-linux_amd64
          path: unittest

      - name: Setup executables
        run: |
          chmod +x cli/duckdb
          chmod +x unittest/unittest
          chmod +x scripts/ci/integration_test.sh

      - name: Wait for SQL Server
        run: |
          echo "Waiting for SQL Server to be ready..."
          timeout 120 bash -c 'until echo > /dev/tcp/localhost/1433 2>/dev/null; do sleep 5; done'
          echo "SQL Server is ready!"

      # The service container starts bare. Locally `make docker-up` runs an init container that
      # applies this script; the .test files expect the schema and seed rows it creates (TestDB
      # plus master.dbo.test), and fail without them.
      - name: Seed test database
        env:
          SQLSERVER_ID: ${{ job.services.sqlserver.id }}
        run: |
          # Seed from inside the service container rather than installing mssql-tools18 on
          # the runner. The image already ships /opt/mssql-tools18/bin/sqlcmd — the health
          # check above is that exact binary, so a healthy service proves it is present.
          #
          # The host-side install was worse than redundant: it added packages.microsoft.com
          # to apt, but the ubuntu-22.04 image already configures that same repo pinned to
          # /usr/share/keyrings/microsoft-prod.gpg. Two Signed-By values for one source makes
          # apt refuse to read *any* sources, so `apt-get update` exited 100 before installing
          # anything and the seed never ran (CI run #566). See #199.
          docker cp docker/init/init.sql "$SQLSERVER_ID:/tmp/init.sql"
          docker cp docker/init/init-transaction-tests.sql "$SQLSERVER_ID:/tmp/init-transaction-tests.sql"
          # No -b (exit-on-error): init.sql does not run cleanly even against a fresh server —
          # one AllDataTypes INSERT does DATEADD(day, id, col_datetime2) over a far-future seed
          # row and trips "Msg 517 ... datetime2 ... overflow", terminating that statement. This
          # is pre-existing and happens locally too (make docker-up prints it and carries on);
          # the suite passes without those rows. -b here would fail every run for a benign,
          # long-standing reason. integration_test.sh verifies the seed landed instead, so a
          # genuinely broken seed is still caught rather than silently skipped. See #199.
          docker exec "$SQLSERVER_ID" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P TestPassword1 -C -i /tmp/init.sql
          docker exec "$SQLSERVER_ID" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P TestPassword1 -C -i /tmp/init-transaction-tests.sql
          echo "Seed applied."

      - name: Run integration tests
        env:
          MSSQL_TEST_HOST: localhost
          MSSQL_TEST_PORT: 1433
          MSSQL_TEST_USER: sa
          MSSQL_TEST_PASS: TestPassword1
          MSSQL_TEST_DB: master
        run: |
          scripts/ci/integration_test.sh ./cli/duckdb ./extension/mssql.duckdb_extension ./unittest/unittest

  # ============================================================================
  # Windows Build Job - MSVC (Visual Studio 2022)
  # Matches community-extensions CI configuration
  # (Manual trigger only via workflow_dispatch)
  # ============================================================================
  build-windows-msvc:
    name: Build Windows (MSVC)
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_windows_build }}

    env:
      # Must be set explicitly: run-vcpkg otherwise forces the dead x-gha
      # provider on GitHub runners. Its own source says
      #   "Allow users to define the vcpkg's binary source explicitly in the
      #    workflow, in that case do not override it."
      #   setVariableIfUndefined(VCPKG_BINARY_SOURCES, 'clear;x-gha,readwrite')
      # so defining it here is the supported opt-out.
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite'

    steps:
      - uses: actions/checkout@v7

      - name: Checkout DuckDB submodule
        shell: bash
        run: |
          git submodule update --init --recursive duckdb

      - name: Log build metadata
        id: duckdb
        shell: bash
        run: |
          DUCKDB_COMMIT=$(git -C duckdb rev-parse HEAD)
          echo "commit=$DUCKDB_COMMIT" >> $GITHUB_OUTPUT
          echo "============================================"
          echo "Build Metadata"
          echo "============================================"
          echo "DuckDB Commit: $DUCKDB_COMMIT"
          echo "Platform: windows_amd64 (MSVC)"
          echo "vcpkg Triplet: x64-windows-static-release (matches community-extensions CI / extension-ci-tools main)"
          echo "============================================"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '65604f5075c64b18a84c30de400def13aad2e0ec'

      # Caches the binary-cache dir named by VCPKG_BINARY_SOURCES above, not
      # the install tree -- see the linux/macos build job for why the old
      # vcpkg/installed + vcpkg/packages paths never elided a rebuild.
      # Namespace is the vcpkg triplet, deliberately NOT job- or workflow-scoped:
      # release.yml's MSVC job uses the same triplet and shares this namespace.
      #
      # Caveat -- unlike the Linux/macOS namespaces, this one is NOT seeded
      # automatically. Both Windows jobs are gated on
      #   if: github.event_name == 'workflow_dispatch' && inputs.run_windows_build
      # so the weekly cron (which does seed x64-linux / arm64-osx from main)
      # never runs them. Only a manual main-branch dispatch with "Run Windows
      # build jobs" ticked writes a cache on refs/heads/main; until someone
      # does that, release.yml's MSVC job rebuilds OpenSSL from scratch on
      # every tag. Adding `|| github.event_name == 'schedule'` here would fix
      # that at the cost of two Windows builds per week on main.
      # See the linux/macos job for why the primary key carries github.run_id.
      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: vcpkg_bincache
          key: vcpkg-bincache-x64-windows-static-release-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bincache-x64-windows-static-release-

      - name: Setup Visual Studio Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/release
          Push-Location build/release
          cmake -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:RUNVCPKG_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-release `
            -DVCPKG_HOST_TRIPLET=x64-windows-static-release `
            -DVCPKG_MANIFEST_DIR="$(Get-Location)/../.." `
            -DDUCKDB_EXTENSION_CONFIGS="$(Get-Location)/../../extension_config.cmake" `
            ../../duckdb
          cmake --build . --config Release
          Pop-Location

      # See the linux/macos build job for why the binary cache needs pruning.
      - name: Prune stale vcpkg binary archives
        if: always()
        shell: bash
        run: |
          [ -d vcpkg_bincache ] || exit 0
          echo "before: $(du -sh vcpkg_bincache | cut -f1)"
          find vcpkg_bincache -type f -mtime +14 -delete
          find vcpkg_bincache -mindepth 1 -type d -empty -delete
          echo "after:  $(du -sh vcpkg_bincache | cut -f1)"

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mssql-extension-windows_amd64_msvc
          path: build/release/extension/mssql/mssql.duckdb_extension
          if-no-files-found: error

      - name: Upload DuckDB CLI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: duckdb-cli-windows_amd64_msvc
          path: build/release/duckdb.exe
          if-no-files-found: error

  # ============================================================================
  # Windows Build Job - MinGW (Rtools 4.2)
  # Matches community-extensions CI configuration
  # (Manual trigger only via workflow_dispatch)
  # ============================================================================
  build-windows-mingw:
    name: Build Windows (MinGW)
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_windows_build }}
    env:
      CC: gcc
      CXX: g++
      # See the MSVC job: defining this is the supported way to stop run-vcpkg
      # forcing the removed x-gha provider.
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite'

    steps:
      - uses: actions/checkout@v7

      - name: Checkout DuckDB submodule
        shell: bash
        run: |
          git submodule update --init --recursive duckdb

      - name: Log build metadata
        id: duckdb
        shell: bash
        run: |
          DUCKDB_COMMIT=$(git -C duckdb rev-parse HEAD)
          echo "commit=$DUCKDB_COMMIT" >> $GITHUB_OUTPUT
          echo "============================================"
          echo "Build Metadata"
          echo "============================================"
          echo "DuckDB Commit: $DUCKDB_COMMIT"
          echo "Platform: windows_amd64 (MinGW)"
          echo "vcpkg Triplet: x64-mingw-static"
          echo "============================================"

      # Setup Rtools 4.2 for MinGW compiler
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'devel'
          update-rtools: true
          rtools-version: '42'

      - name: Setup rtools gcc for vcpkg
        shell: bash
        run: |
          cp C:/rtools42/x86_64-w64-mingw32.static.posix/bin/gcc.exe C:/rtools42/x86_64-w64-mingw32.static.posix/bin/x86_64-w64-mingw32-gcc.exe
          cp C:/rtools42/x86_64-w64-mingw32.static.posix/bin/g++.exe C:/rtools42/x86_64-w64-mingw32.static.posix/bin/x86_64-w64-mingw32-g++.exe
          echo "C:/rtools42/x86_64-w64-mingw32.static.posix/bin" >> $GITHUB_PATH
          echo "C:/rtools42/usr/bin" >> $GITHUB_PATH

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '65604f5075c64b18a84c30de400def13aad2e0ec'

      # Caches the binary-cache dir named by VCPKG_BINARY_SOURCES above. This
      # is the job that pays most for the old broken setup: run 29540869000
      # spent 6.9 min compiling OpenSSL for x64-mingw-static from scratch.
      # Same seeding caveat as the MSVC job above: this namespace only gets a
      # main-branch entry from a manual Windows dispatch, never from the cron.
      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: vcpkg_bincache
          key: vcpkg-bincache-x64-mingw-static-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bincache-x64-mingw-static-

      - name: Build Release
        shell: bash
        run: |
          mkdir -p build/release
          cd build/release
          cmake -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_TOOLCHAIN_FILE="$RUNVCPKG_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-mingw-static \
            -DVCPKG_HOST_TRIPLET=x64-mingw-static \
            -DVCPKG_MANIFEST_DIR="$(pwd)/../.." \
            -DDUCKDB_EXTENSION_CONFIGS="$(pwd)/../../extension_config.cmake" \
            ../../duckdb
          cmake --build . --config Release

      # See the linux/macos build job for why the binary cache needs pruning.
      - name: Prune stale vcpkg binary archives
        if: always()
        shell: bash
        run: |
          [ -d vcpkg_bincache ] || exit 0
          echo "before: $(du -sh vcpkg_bincache | cut -f1)"
          find vcpkg_bincache -type f -mtime +14 -delete
          find vcpkg_bincache -mindepth 1 -type d -empty -delete
          echo "after:  $(du -sh vcpkg_bincache | cut -f1)"

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mssql-extension-windows_amd64_mingw
          path: build/release/extension/mssql/mssql.duckdb_extension
          if-no-files-found: error

      - name: Upload DuckDB CLI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: duckdb-cli-windows_amd64_mingw
          path: build/release/duckdb.exe
          if-no-files-found: error

  # ============================================================================
  # Windows Smoke Test Job - Verify extension loads on Windows
  # (Manual trigger only via workflow_dispatch)
  # ============================================================================
  smoke-test-windows:
    name: Smoke Test Windows (${{ matrix.config.name }})
    runs-on: windows-latest
    needs: [build-windows-msvc, build-windows-mingw]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_windows_build }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: MSVC
            artifact_suffix: windows_amd64_msvc
          - name: MinGW
            artifact_suffix: windows_amd64_mingw

    steps:
      - uses: actions/checkout@v7

      - name: Download extension artifact
        uses: actions/download-artifact@v8
        with:
          name: mssql-extension-${{ matrix.config.artifact_suffix }}
          path: extension

      - name: Download DuckDB CLI artifact
        uses: actions/download-artifact@v8
        with:
          name: duckdb-cli-${{ matrix.config.artifact_suffix }}
          path: cli

      - name: Run load-only smoke test
        shell: bash
        run: |
          echo "Testing extension load for ${{ matrix.config.name }} build..."
          ./cli/duckdb.exe -unsigned -c "LOAD 'extension/mssql.duckdb_extension'; SELECT mssql_version();"
          echo "Smoke test passed!"

  # ============================================================================
  # Azure Test Job - Azure SQL Database and Fabric tests
  # Uses 'test' environment for secrets (AZURE_APP_ID, AZURE_APP_SECRET, etc.)
  # Runs DuckDB unittest with [azure] test group
  # (Manual trigger only via workflow_dispatch)
  # ============================================================================
  azure-test:
    name: Azure Test (linux_amd64)
    runs-on: ubuntu-22.04
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_build && inputs.run_azure_tests && github.ref != 'refs/heads/main' }}
    environment: test

    steps:
      - uses: actions/checkout@v7

      - name: Download unittest artifact
        uses: actions/download-artifact@v8
        with:
          name: unittest-linux_amd64
          path: test

      - name: Download libduckdb artifact
        uses: actions/download-artifact@v8
        with:
          name: libduckdb-linux_amd64
          path: lib

      - name: Setup executables
        run: |
          chmod +x test/unittest

      - name: Run Azure tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/lib
          AZURE_SQL_TEST_DSN: ${{ secrets.AZURE_SQL_TEST_DSN }}
          AZURE_APP_ID: ${{ secrets.AZURE_APP_ID }}
          AZURE_DIRECTORY_ID: ${{ secrets.AZURE_DIRECTORY_ID }}
          AZURE_APP_SECRET: ${{ secrets.AZURE_APP_SECRET }}
          AZURE_SQL_DB_HOST: ${{ secrets.AZURE_SQL_DB_HOST }}
          AZURE_SQL_DB: ${{ secrets.AZURE_SQL_DB }}
        run: |
          echo "============================================"
          echo "Running Azure Tests with unittest"
          echo "============================================"
          echo "AZURE_APP_ID is set: $([ -n \"$AZURE_APP_ID\" ] && echo 'yes' || echo 'no')"
          echo "AZURE_DIRECTORY_ID is set: $([ -n \"$AZURE_DIRECTORY_ID\" ] && echo 'yes' || echo 'no')"
          echo "AZURE_APP_SECRET is set: $([ -n \"$AZURE_APP_SECRET\" ] && echo 'yes' || echo 'no')"
          echo "LD_LIBRARY_PATH: $LD_LIBRARY_PATH"
          echo "============================================"

          # Run Azure test group
          ./test/unittest "[azure]" --force-reload

          echo "Azure tests completed!"
