# Dependabot configuration.
#
# Shape follows GitHub's "tame Dependabot" guidance -- group your updates, slow
# the cadence, keep security fast -- with one deliberate departure: the grouping
# is per-STREAM, not per-ecosystem. Both ecosystems group only minor/patch and
# leave majors ungrouped, so a major arrives in a PR that can be merged,
# reverted or bisected on its own instead of riding in under a routine
# approval. Cadence is monthly, with a 7-day cooldown.
#
# Security fixes are raised as soon as an advisory lands -- `groups`, `schedule`
# and `cooldown` shape VERSION updates only -- so slowing the version stream
# costs nothing in vulnerability response time.
#
# Ecosystems deliberately NOT covered, recorded so the omissions read as
# decisions rather than oversights:
#
#   vcpkg (vcpkg.json)  No Dependabot ecosystem exists for it. Bumped by hand
#                       when DuckDB moves its baseline.
#   git submodules      duckdb and extension-ci-tools are pinned to reviewed
#                       SHAs on purpose -- main compiles against the pinned
#                       duckdb SHA only, so tracking their branch HEADs would
#                       break the build on someone else's commit.
#   docker (10 files)   Every base image is either a floating tag Dependabot
#                       cannot compare (`:latest`, `mssql/server:2022-latest`)
#                       or a deliberate pin: docker/Dockerfile.build stays on
#                       ubuntu:22.04 for the glibc the released Linux binary
#                       links against, and the kerberos / named-instance
#                       fixtures pin the OS they were written against.
#   web/index.html      Loads @duckdb/duckdb-wasm and @observablehq/plot from
#                       jsDelivr at pinned versions. They are in no manifest,
#                       so Dependabot cannot see them -- bump by hand.

version: 2

updates:
  # GitHub Actions. Split by update-type for the same reason as npm below, and
  # the two pinning styles in use here are why: most workflows pin a major tag
  # (actions/checkout@v7) where the only possible bump is a major, but
  # codeql.yml pins a full patch version (github/codeql-action@v4.37.8 as of
  # #291, and it moves again on the next patch). So this ecosystem really does
  # have both streams, and grouping all of it would ride a major in on the same
  # approval as a patch -- PR #291 did exactly that, landing setup-node
  # v6 -> v7 alongside a codeql-action patch. Majors are left ungrouped and get
  # their own PR.
  #
  # The limit is 10, not the default 5: the workflows use ~20 distinct actions
  # and each major-updated one now takes a PR of its own, so 5 could silently
  # withhold updates rather than merely defer them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope

  # Docusaurus documentation site: 1391 transitive packages that `npm ci` runs
  # inside the Pages deploy, which holds `pages: write` + `id-token: write`.
  # Much the largest third-party surface in the repo, and until now the only
  # one Dependabot watched not at all.
  #
  # Only the minor/patch stream is grouped, and that asymmetry is the point:
  # a major here means Docusaurus 3 -> 4 or React 19 -> 20 and wants its own
  # review, so majors are left UNGROUPED and Dependabot gives each its own PR
  # -- one that can be merged, reverted or bisected on its own. Grouping them
  # would do the opposite, landing Docusaurus 4 and React 20 in a single
  # branch mergeable only as a unit.
  #
  # Every PR from this ecosystem is built by .github/workflows/docs-build.yml,
  # which runs `npm ci && npx docusaurus build` on any PR touching website/.
  # pages.yml -- the only other place that builds the site -- has no
  # pull_request trigger, so without that workflow these PRs would carry no
  # evidence the site still builds.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      website-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # @docusaurus/theme-mermaid 3.10.2 declares a peerOptional of
      # @mermaid-js/layout-elk ^0.1.9, so anything in 0.2.x fails `npm ci`
      # outright:
      #   npm error ERESOLVE could not resolve
      #   npm error peerOptional @mermaid-js/layout-elk@"^0.1.9"
      #                          from @docusaurus/theme-mermaid@3.10.2
      # Not a judgement call about the release -- the tree cannot install.
      # Closing the PR does not hold: #289 was closed by hand and Dependabot
      # re-raised it as #293 sixty-seven seconds after the next push to main,
      # because it re-evaluates on every push.
      #
      # REMOVE THIS ENTRY once @docusaurus/theme-mermaid widens the peer range
      # to accept 0.2.x -- check its package.json on the next Docusaurus bump.
      - dependency-name: "@mermaid-js/layout-elk"
        versions: [">=0.2.0"]
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - documentation
    commit-message:
      prefix: docs
      include: scope
