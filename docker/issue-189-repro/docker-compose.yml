# Self-contained reproduction stack for issue #189 — "no connection lifetime a
# shared temp table can anchor to". SQL Server 2022 + a Python/DuckDB sidecar
# that populates a source table and exercises the four failure modes (R1-R4).
# See docs/proposals/issue-189-connection-lease-proposal.md.
#
# Usage:
#   cd docker/issue-189-repro
#   docker compose run --build --rm repro    # exit code 0 = all failure modes reproduced
#   docker compose down -v
#
# The sidecar uses the released community `mssql` extension by default (what
# users run). To verify a local build instead, uncomment the volume below and
# set MSSQL_EXTENSION_PATH.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64  # SQL Server images are amd64-only; Rosetta on ARM Macs
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-TestPassword1}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${MSSQL_SA_PASSWORD:-TestPassword1} -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    # Uncomment to reach the server from the host (non-standard port to avoid
    # clashing with the mssql-dev container from docker/docker-compose.yml):
    # ports:
    #   - "14189:1433"

  repro:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - MSSQL_HOST=sqlserver
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-TestPassword1}
      # - MSSQL_EXTENSION_PATH=/ext/mssql.duckdb_extension
    # volumes:
    #   - ../../build/release/extension/mssql:/ext:ro
